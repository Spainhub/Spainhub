<style>
:root{
  --bg:#fff; --ink:#252525; --muted:#858585; --line:#e9e9e9; --head:#f1f2f4;
  --accent:#ff7f57; --accent-soft:#fff1ec; --purple:#7b61a5; --total:#fff2ed; --shadow:0 2px 12px rgba(0,0,0,.045);
  --abc-a:#d7efd5; --abc-a-ink:#1e6b2c;
  --abc-b:#fde3c4; --abc-b-ink:#9a5200;
  --abc-c:#f8d3d3; --abc-c-ink:#a12525;
  --head-h:34px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;text-align:left}
button,input{font:inherit}
.app{width:100%;padding:10px 16px 24px}
.topbar{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 2px 8px;margin-bottom:8px}
.topbar-mark{font-size:19px;font-weight:800;letter-spacing:.6px;color:var(--accent);line-height:1.2}
.topbar-actions{display:flex;align-items:center;gap:5px}
.btn-text{border:0;background:transparent;color:var(--accent);padding:6px 9px;border-radius:6px;font-size:12px;font-weight:650;cursor:pointer}
.btn-text:hover{background:var(--accent-soft)}
.btn-text:disabled{opacity:.45;cursor:wait}
.data-status{font-size:11px;color:var(--muted);margin-right:5px}
.tabs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:10px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px 8px;color:#111;font-size:12px;font-weight:650;white-space:nowrap;cursor:pointer}
.tab:hover{background:#f4f4f5}
.tab.on,.tab.on:hover{color:var(--accent);background:none}
.tab.on{border-bottom-color:var(--accent)}
.spacer{flex:1 1 auto}
.tab-tools{display:flex;align-items:center;gap:10px;padding:3px 0}
.tab-tools .count{font-size:11px;color:var(--muted);white-space:nowrap}
.tab-tools input[type=search]{width:240px;max-width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:7px;outline:none;font-size:12px}
.tab-tools input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,127,87,.10)}
.pane[hidden]{display:none!important}

/* ── Информационный блок (строки 1–5 листа) ── */
.info-grid{width:100%;table-layout:fixed;border-collapse:collapse;margin:0 0 10px}
.info-grid td{padding:1px 4px;height:19px;line-height:1.3;text-align:left;vertical-align:middle;white-space:nowrap;overflow:visible;color:#555;font-size:12px}
.info-grid tr.r1 td{font-size:17px;font-weight:400;color:var(--ink);height:26px;letter-spacing:-.2px}
.info-grid tr.r2 td{font-size:13px;font-weight:400;color:#444}
.info-grid tr.blank td{height:8px;padding:0}
.info-grid td.merged{overflow:hidden;text-overflow:ellipsis}


.tbl-wrap{width:100%;max-width:100%;overflow-x:auto;overflow-y:auto;max-height:74vh;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow)}
table.report{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
table.report th,table.report td{box-sizing:border-box;text-align:left;white-space:nowrap}
table.report thead th{
  position:sticky;top:0;z-index:3;background:var(--head);color:#383838;
  font-weight:700;padding:7px 10px 7px 8px;border-bottom:1px solid #dedfe2;
  line-height:1.2;vertical-align:middle;overflow:visible;
}
table.report thead th.sortable,table.report thead th.focusable{cursor:pointer}
table.report thead th.sortable:hover,table.report thead th.focusable:hover{background:#e9eaed}
.th-in{display:flex;align-items:center;gap:3px;min-width:0}
.th-label{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sort-ind{color:var(--accent);font-size:9px;flex:none}
.col-filter-btn{border:0;background:transparent;color:#888;font-size:8px;padding:1px 2px;cursor:pointer;flex:none}
.col-filter-btn.on{color:var(--accent)}
.col-grip{position:absolute;top:0;right:0;width:9px;height:100%;cursor:col-resize;z-index:4;touch-action:none}
.col-grip::after{content:"";position:absolute;top:22%;bottom:22%;right:3px;width:2px;border-radius:1px;background:#cfd2d8}
.col-grip:hover::after,body.resizing .col-grip::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
table.report th.filler,table.report td.filler{padding:0}
table.report tbody td{padding:6px 8px;border-bottom:1px solid #f0f0f0;line-height:1.25;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
table.report tbody tr:nth-child(even){background:#fafafa}
table.report tbody tr:hover{background:#fff6f3}

/* Закреплённые первые столбцы (горизонтальная прокрутка) */
table.report th.frz,table.report td.frz{position:sticky;z-index:2}
table.report th.frz1,table.report td.frz1{left:0}
table.report th.frz2,table.report td.frz2{left:var(--frz2-left,0px);box-shadow:2px 0 0 #e3e4e8}
table.report thead th.frz{z-index:6;background:var(--head)}
table.report tbody td.frz{background:#fff}
table.report tbody tr:nth-child(even) td.frz{background:#fafafa}
table.report tbody tr:hover td.frz{background:#fff6f3}
tr.total-row td.frz{z-index:5;background:var(--total)!important}

/* Столбец, выделенный оранжевым текстом (STOCKUP: «Total for procurement per month») */
table.report td.col-accent{color:var(--accent);font-weight:650}

/* WB: строка открывает график во всплывающем окне */
table.report tbody tr.clickable{cursor:pointer}

/* Отрицательные значения */
.neg{color:#d12f2f!important}
.info-grid td.neg{color:#d12f2f}

/* ABC: аккуратные одинаковые «пилюли», ячейка без заливки */
.abc-pill{display:inline-block;min-width:26px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.3;text-align:center;border:1px solid transparent}
.abc-pill.abc-A{background:#e8f5ec;color:#23703a;border-color:#bfe2c9}
.abc-pill.abc-B{background:#fdf0e1;color:#b2600f;border-color:#f4d3ab}
.abc-pill.abc-C{background:#fbe8e8;color:#b03030;border-color:#efc0c0}

tr.total-row td{position:sticky;top:var(--head-h);z-index:2;background:var(--total)!important;font-weight:750;border-bottom:1px solid var(--accent)}

.chart-action-cell{text-align:left;overflow:hidden}
.spark{display:block;width:110px;height:26px}
.chart-cell{display:flex;align-items:center;gap:7px;min-width:130px}
.spark-empty{color:#bbb}
.row-chart-btn{border:1px solid #ffd2c4;background:#fff6f3;color:#e5603a;border-radius:5px;padding:3px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
.row-chart-btn:hover{background:#ffe6dd;border-color:#ffab94}

.filter-pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:9px;width:250px}
.filter-pop input[type=search]{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;font-size:12px;margin-bottom:7px}
.filter-pop .vals{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.filter-pop label{display:flex;gap:7px;align-items:center;font-size:11px;padding:4px 2px;cursor:pointer}
.filter-pop label input{margin:0;accent-color:var(--accent)}
.pop-actions{display:flex;gap:5px;margin-top:8px}
.pop-actions button{flex:1;padding:6px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:11px;cursor:pointer}
.pop-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}

.state{padding:30px 16px;text-align:left;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #f1e5dc;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.tables-row{display:flex;flex-direction:column;gap:18px;width:100%}
.table-block{min-width:0;width:100%}
.table-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.table-head .sub-table-title{margin:0}
.view-bar-host:empty{display:none}
.view-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.view-bar-host .view-bar{margin:0 0 8px}
.view-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bar-label{font-size:11px;font-weight:700;color:var(--muted);margin:0 2px 0 8px;letter-spacing:.5px}
.chip{border:1px solid var(--line);background:#fff;color:#555;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:650;cursor:pointer;line-height:1.3}
.chip:hover{border-color:#e3b898}
.chip.all.on{background:#333;border-color:#333;color:#fff}
.chip.unit.on{background:var(--accent);border-color:var(--accent);color:#fff}
.abc-chip{min-width:30px}
.abc-chip.abc-A.on{background:#e8f5ec;color:#23703a;border-color:#7cc592}
.abc-chip.abc-B.on{background:#fdf0e1;color:#b2600f;border-color:#eba865}
.abc-chip.abc-C.on{background:#fbe8e8;color:#b03030;border-color:#e49393}
.cols-btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:650;color:#555;cursor:pointer;white-space:nowrap}
.cols-btn:hover,.cols-btn.on{border-color:var(--accent);color:var(--accent)}
.pop-title{font-size:11px;font-weight:700;color:#555;margin:0 0 7px}
.sub-table-title{font-size:12px;font-weight:750;margin:0 0 6px;padding:5px 8px;border-left:3px solid var(--accent);background:#f7f7f7;border-radius:4px;color:#444}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,70px);opacity:0;transition:.2s;background:#262626;color:#fff;padding:9px 14px;border-radius:7px;font-size:12px;z-index:120;pointer-events:none;max-width:calc(100% - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.chart-modal{position:fixed;inset:0;background:rgba(25,25,25,.34);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.chart-modal.on{display:flex}
.chart-dialog{width:min(760px,100%);height:min(440px,80vh);background:#fff;border-radius:12px;box-shadow:0 15px 50px rgba(0,0,0,.2);padding:15px 17px;display:flex;flex-direction:column}
.chart-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.chart-kicker{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--accent);margin-bottom:3px}
.chart-box:empty{display:none}
.chart-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin:0 0 16px}
.chart-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px 8px;background:#fff;box-shadow:var(--shadow);min-width:0}
.chart-card-title{font-size:12px;font-weight:600;color:#333;margin-bottom:10px}
.chart-card-canvas{position:relative;height:340px}
@media(max-width:850px){.chart-grid{grid-template-columns:minmax(0,1fr)}}
.view-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow);padding:6px}
table.view-grid{table-layout:fixed;border-collapse:collapse;font-size:10pt;color:#202124}
table.view-grid td{padding:1px 4px;overflow:hidden;line-height:1.3;box-sizing:border-box}
/* Гиперссылки внутри текста: подсветка + подчёркивание + стрелка */
a.lnk{color:#0b57d0;background:#e8f0fe;border-bottom:1.5px solid #0b57d0;text-decoration:none;font-weight:600;border-radius:3px;padding:0 3px;cursor:pointer}
a.lnk::after{content:" ↗";font-size:.8em}
a.lnk:hover{background:#d2e3fc}
a.lnk:visited{color:#6a3fb5;border-bottom-color:#6a3fb5}
.chart-sub{font-size:12px;color:#777;margin-top:3px}
.chart-dialog h3{font-size:15px;margin:0;font-weight:750}
.chart-close{border:0;background:#f3f3f3;border-radius:50%;width:28px;height:28px;font-size:21px;line-height:1;cursor:pointer;color:#555}
.chart-canvas-wrap{position:relative;flex:1;min-height:0}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:#999}

@media(max-width:850px){.app{padding:8px 10px 20px}table.report{font-size:11px}table.report thead th,table.report tbody td{padding-left:5px;padding-right:5px}}
@media(max-width:620px){.topbar{align-items:flex-start}.topbar-actions{gap:0}.data-status{display:none}.tab-tools{flex:1 1 100%}.tab-tools input[type=search]{width:100%}.tab{padding:9px 9px;font-size:11px}.tbl-wrap{max-height:60vh}.footer{flex-direction:column;gap:4px}.chart-dialog{height:70vh;padding:12px}}
@media print{
  .app{padding:0}.topbar,.tabs,.footer,.toast,.chart-modal,.col-filter-btn,.row-chart-btn,.view-bar{display:none!important}.table-head .sub-table-title{margin:0}
  .tbl-wrap{max-height:none;overflow:visible;box-shadow:none;border:0}
  table.report{font-size:8px;table-layout:auto}table.report th,table.report td{padding:3px;white-space:normal}.col-grip{display:none}
  table.report thead th,tr.total-row td{position:static}
  table.report .abc-pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

# Хостовый nginx: /etc/nginx/conf.d/finans.winscoms.com.conf  (или sites-available + симлинк)
# Сначала только HTTP. HTTPS добавит certbot:  sudo certbot --nginx -d finans.winscoms.com
# Порт 8091 должен совпадать с PROXY_PORT в .env.
server {
    listen 80;
    listen [::]:80;
    server_name finans.winscoms.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Внутренний nginx контейнера proxy. Снаружи доступен только через 127.0.0.1:${PROXY_PORT}.
# Внешний (хостовый) nginx пробрасывает сюда https://winscoms.com/pnl/ без изменения пути.
server {
    listen 80;
    server_name _;

    location = /pnl { return 301 /pnl/; }

    # /pnl/api/... -> backend:/api/...
    location /pnl/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /pnl/... -> frontend:/...
    location /pnl/ {
        proxy_pass http://frontend:80/;
    }
}

# Внутренний nginx контейнера proxy. Снаружи доступен только через 127.0.0.1:${PROXY_PORT}.
# Хостовый nginx (finans.winscoms.com, HTTPS) пробрасывает сюда запросы без изменения пути.
#
# resolver + переменные в proxy_pass заставляют nginx заново разрешать имена backend/frontend через DNS Docker:
# после пересоздания контейнера (новый IP) прокси не «залипает» на старом адресе.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;   # реальный IP задаёт хостовый nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
    }
}

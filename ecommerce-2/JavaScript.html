<script>
/* ============================================================================
 * E-commerce 2.0 — клиентская логика (vanilla JS, без зависимостей).
 * Данные приходят с сервера одним снимком (getAllData), интерфейс строится из него.
 * Любое изменение отправляется на сервер, после чего снимок перечитывается из таблицы.
 * ========================================================================== */
(function () {
  'use strict';

  /* ---------- Состояние ---------- */
  var S = {
    token: null, user: '', data: null, meta: null,
    tab: 'home',
    idx: { byId: {}, parent: {}, children: {}, docs: {}, votes: {} },
    cal: { mode: 'month', cursor: null },
    gantt: { collapsed: {}, dw: 24, blockOnly: false, deps: lsGet('ec2_gantt_deps') !== '0', lw: Number(lsGet('ec2_gantt_lw')) || 0, sel: null },   // dw — пикселей на день
    exch: { filter: 'flow', q: '' },
    exchCards: null, exchErr: '',
    info: null, infoErr: '', infoBusy: false, infoAt: 0,
    regOpen: {},
    kb: { type: 'all' },
    tbl: { rows: null, err: '', q: '', collapsed: {} },
    logFilter: { entity_type: '', date_from: '', date_to: '', entity_id: '' },
    drawer: null,
    modalButtons: []
  };

  var DAY = 864e5;
  var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var ACTIONS = {
    create: 'Создание', update: 'Изменение', 'delete': 'Удаление',
    link_add: 'Связь добавлена', link_update: 'Связь изменена', link_delete: 'Связь удалена',
    doc_add: 'Документ добавлен', doc_update: 'Документ изменён', doc_delete: 'Документ удалён',
    login: 'Вход', setting: 'Настройки проекта', vote: 'Голосование'
  };
  // Подписи полей, которых нет в схеме сущностей
  var FIELD_EXTRA = { vote: 'Голос', vote_comment: 'Комментарий к голосу', voters: 'Участники голосования' };

  /* ---------- Утилиты ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function pd(s) {                       // 'ГГГГ-ММ-ДД' -> UTC-миллисекунды (NaN при ошибке)
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
  }
  function fd(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
  function ru(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; }
  function ruShort(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? m[3] + '.' + m[2] : ''; }
  function fmtTs(ts) { var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(ts || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] + ' ' + m[4] + ':' + m[5] : (ts || ''); }
  function today() { return S.meta.today; }
  /** localStorage helpers: the browser may deny access, the UI must keep working. */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } }
  function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* хранилище недоступно */ } }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  var busyCount = 0;
  function busy(d) { busyCount = Math.max(0, busyCount + d); $('#busy').hidden = busyCount === 0; }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('#toast');
    t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 6000 : 2600);
  }

  /** Вызов серверного метода через google.script.run -> Promise<data>. */
  function call(method) {
    var args = Array.prototype.slice.call(arguments, 1);
    busy(1);
    return new Promise(function (resolve, reject) {
      var run = google.script.run
        .withSuccessHandler(function (r) {
          busy(-1);
          if (r && r.ok) resolve(r.data);
          else { var err = new Error((r && r.error) || 'Ошибка сервера'); err.code = r && r.code; reject(err); }
        })
        .withFailureHandler(function (e) { busy(-1); reject(new Error((e && e.message) || String(e))); });
      run[method].apply(run, args);
    });
  }
  /** Вызов с токеном сессии; при истёкшей сессии возвращает на экран входа. */
  function authCall(method) {
    var args = [method, S.token].concat(Array.prototype.slice.call(arguments, 1));
    return call.apply(null, args).catch(function (err) {
      if (err.code === 'AUTH') showLogin('Сессия истекла, войдите снова');
      throw err;
    });
  }

  /* ---------- Справочники и производные значения ---------- */
  function enumOf(name) { return (S.meta.enums[name] || []); }
  function enumLabel(name, val) {
    var x = enumOf(name).filter(function (e) { return e.value === val; })[0];
    return x ? x.label : (val || '');
  }
  function typeLabel(t) { return (S.meta.types[t] && S.meta.types[t].label) || ({ system: 'Система', project: 'Проект' }[t]) || t || ''; }
  function fieldDefs(t) { return S.meta.types[t].fields; }
  function statusEnum(t) {
    var d = fieldDefs(t).filter(function (f) { return f.key === 'status'; })[0];
    return d ? d.enum : 'status';
  }
  function fieldLabel(k) { return FIELD_EXTRA[k] || S.meta.fieldLabels[k] || k; }
  function statusLabel(e) { return enumLabel(statusEnum(e._type), e.status); }
  function pill(e) { return '<span class="pill s-' + esc(String(e.status).replace(/\s/g, '')) + '">' + esc(statusLabel(e)) + '</span>'; }
  function typeTag(t) { return '<span class="tag t-' + t + '">' + esc(typeLabel(t)) + '</span>'; }
  function ownerOf(e) { return e._type === 'approval' ? (e.approver || e.assignee) : e.assignee; }

  function isDoneLike(e) {
    return ['Done', 'Approved', 'Rejected', 'Held', 'Cancelled'].indexOf(e.status) !== -1;
  }
  function isBlocked(e) { return e.blocked === true || e.status === 'Blocked'; }
  function dateOf(e) { return e._type === 'meeting' ? e.meeting_date : e.deadline; }
  function isOverdue(e) {
    if (e._type === 'meeting') return false;
    return !!e.deadline && e.deadline < today() && !isDoneLike(e);
  }

  function buildIndex() {
    var d = S.data, idx = { byId: {}, parent: {}, children: {}, docs: {}, votes: {} };
    S.meta.typeOrder.forEach(function (t) {
      d.entities[t].forEach(function (e) { e._type = t; idx.byId[e.id] = e; });
    });
    d.links.forEach(function (l) {
      if (l.link_type === 'parent') {
        idx.parent[l.source_id] = l.target_id;
        (idx.children[l.target_id] = idx.children[l.target_id] || []).push(l.source_id);
      }
    });
    d.documents.forEach(function (x) { (idx.docs[x.entity_id] = idx.docs[x.entity_id] || []).push(x); });
    (d.register || []).forEach(function (r) { (idx.votes[r.approval_id] = idx.votes[r.approval_id] || []).push(r); });
    S.idx = idx;
  }

  /** Прогресс: у этапа/задачи с дочерними элементами считается как среднее по ним. */
  function effProgress(e) {
    var kids = (S.idx.children[e.id] || []).map(function (id) { return S.idx.byId[id]; }).filter(function (k) {
      return k && (k._type === 'task' || k._type === 'subtask');
    });
    if (e._type === 'approval') return e.status === 'Approved' ? 100 : 0;
    if (!kids.length) return e.status === 'Done' ? 100 : Math.round(Number(e.progress) || 0);
    var sum = 0;
    kids.forEach(function (k) { sum += effProgress(k); });
    return Math.round(sum / kids.length);
  }
  function progressItems() {            // корневые элементы для общего прогресса
    var d = S.data.entities;
    if (d.stage.length) return d.stage;
    return d.task;
  }

  /* ---------- Вход / выход ---------- */
  /** Fills the participant dropdown from the server; shows a neutral message when the list is empty. */
  function loadParticipants() {
    var sel = $('#loginName'), btn = $('#loginForm button[type=submit]'), note = $('#loginEmpty');
    sel.innerHTML = '<option value="">Загрузка…</option>'; sel.disabled = true; btn.disabled = true; note.hidden = true;
    call('getUsers').then(function (names) {
      if (!names.length) {
        sel.innerHTML = '<option value="">—</option>';
        note.textContent = 'Список участников пуст'; note.hidden = false;
        return;
      }
      var last = '';
      try { last = localStorage.getItem('ec2_name') || ''; } catch (e) { /* storage unavailable */ }
      sel.innerHTML = '<option value="">Выберите имя</option>' + names.map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === last ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');
      sel.disabled = false; btn.disabled = false;
    }).catch(function (err) { sel.innerHTML = '<option value="">—</option>'; note.textContent = err.message; note.hidden = false; });
  }

  function showLogin(msg) {
    S.token = null; store('ec2_token', null);
    $('#app').hidden = true; $('#login').hidden = false;
    closeDrawer(); closeModal();
    var er = $('#loginError');
    er.hidden = !msg; er.textContent = msg || '';
    $('#loginPass').value = '';
    loadParticipants();
  }

  function onLogin(ev) {
    ev.preventDefault();
    var name = $('#loginName').value, pass = $('#loginPass').value;
    var er = $('#loginError');
    if (!name) { er.hidden = false; er.textContent = 'Выберите имя из списка'; return; }
    call('login', pass, name).then(function (r) {
      S.token = r.token; store('ec2_token', r.token);
      try { localStorage.setItem('ec2_name', r.user); } catch (e) { /* storage unavailable */ }
      er.hidden = true;
      $('#login').hidden = true;
      return loadAll();
    }).catch(function (err) { er.hidden = false; er.textContent = err.message; });
  }

  function logout() {
    var t = S.token;
    if (t) call('logout', t).catch(function () { /* не критично */ });
    showLogin('');
  }

  /* ---------- Загрузка данных ---------- */
  function loadAll() {
    return authCall('getAllData').then(function (data) {
      S.data = data; S.meta = data.meta; S.user = data.user;
      buildIndex();
      $('#userName').textContent = S.user;
      $('#usersList').innerHTML = data.users.map(function (u) { return '<option value="' + esc(u.name) + '">'; }).join('');
      $('#app').hidden = false; $('#login').hidden = true;
      if (!S.cal.cursor) S.cal.cursor = today();
      renderTab(S.tab);
    });
  }

  /** Перечитать данные и перерисовать открытую вкладку и разделы карточки. */
  function reload() {
    return authCall('getAllData').then(function (data) {
      S.data = data; S.meta = data.meta;
      buildIndex();
      $('#usersList').innerHTML = data.users.map(function (u) { return '<option value="' + esc(u.name) + '">'; }).join('');
      renderTab(S.tab, true);
      if (S.drawer && S.drawer.id) renderDrawerSections();
    });
  }

  /* ---------- Вкладки ---------- */
  function switchTab(tab) {
    S.tab = tab;
    $$('.tab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    $$('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'v-' + tab); });
    renderTab(tab);
  }

  function renderTab(tab, keepScroll) {
    if (!S.data) return;
    if (tab === 'home') renderHome();
    else if (tab === 'exchange') renderExchange();
    else if (tab === 'meetings') renderMeetings();
    else if (tab === 'kanban') renderKanban();
    else if (tab === 'table') renderTable();
    else if (tab === 'gantt') renderGantt(keepScroll);
    else if (tab === 'log') renderLog();
  }

  /* ============================================================================
   * ГЛАВНАЯ
   * ========================================================================== */
  function describeLog(r) {
    var base = (ACTIONS[r.action] || r.action);
    if (/^(link|doc)_/.test(r.action)) {          // в тексте связи/документа идентификаторы уже есть
      return base + ': ' + stripUrls(r.new_value || r.old_value);
    }
    if (r.entity_id) base += ': ' + typeLabel(r.entity_type).toLowerCase() + ' ' + r.entity_id;
    if (r.action === 'update' || r.action === 'vote') {
      base += ', «' + fieldLabel(r.field) + '»: ' + fmtLogVal(r, r.old_value) + ' → ' + fmtLogVal(r, r.new_value);
    } else if (r.action === 'create' && r.new_value) {
      base += ' «' + r.new_value + '»';
    } else if (r.action === 'delete' && r.old_value) {
      base += ' «' + r.old_value + '»';
    } else if (r.action === 'setting') {
      base = ACTIONS.setting + ': ' + fieldLabel(r.field);
    }
    return base;
  }

  function fmtLogVal(r, v) {
    if (v === '' || v === null || v === undefined) return '—';
    if (r.field === 'vote') return enumLabel('vote', v);
    if (r.field === 'status' && S.meta.types[r.entity_type]) return enumLabel(statusEnum(r.entity_type), v);
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return ru(v);
    if (r.field === 'progress') return v + '%';
    return stripUrls(v);
  }

  /* ---------- Document output: the name is the hyperlink, the URL is never shown ---------- */
  /** Neutral label when a document has no real name (empty or the address itself). */
  function docLabel(name) {
    var n = String(name || '').trim();
    return !n || /^https?:\/\//i.test(n) ? 'Документ' : n;
  }
  function docHTML(name, url) {
    return '<div class="doc-ref"><a class="doc-title" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(docLabel(name)) + '</a></div>';
  }
  /** Removes raw addresses from free text (history, log values) before it is displayed. */
  function stripUrls(v) {
    return String(v === null || v === undefined ? '' : v).replace(/\s*[—-]\s*https?:\/\/\S+/g, '').replace(/https?:\/\/\S+/g, 'ссылка');
  }

  /* ---------- Блок «Файлы проекта» ---------- */
  /**
   * Renders the project files exactly as laid out in the source: same order, same nesting.
   * Plain text stays plain; a hyperlink is attached to its own text and the URL itself is never shown.
   */
  function infoBlockHTML() {
    var i = S.info;
    var head = '<div class="card-head"><h4>Файлы проекта</h4><span class="small muted">' +
      '<button class="link-btn pbtn" data-act="info-refresh">Обновить</button></span></div>';
    if (S.infoErr) return head + '<div class="form-error">' + esc(S.infoErr) + '</div>';
    if (!i) return head + '<div class="loading"><span class="spinner"></span>Загрузка…</div>';
    if (!i.count) return head + '<div class="empty"><b>Файлов пока нет</b>Данные появятся после добавления.</div>';
    // One CSS grid for the whole block: a cell sits in the same column as in the source range, so links
    // that live in different columns stay in different columns. Empty source rows keep their height.
    var cols = 1, first = i.rows[0].row;
    i.rows.forEach(function (r) { r.cells.forEach(function (c) { cols = Math.max(cols, c.col + 1); }); });
    var cells = '';
    i.rows.forEach(function (r) {
      r.cells.forEach(function (c, idx) {
        var pad = idx === 0 && r.indent ? ' padding-left:' + (r.indent * 16) + 'px;' : '';
        cells += '<div class="info-cell" style="grid-row:' + (r.row - first + 1) + ';grid-column:' + (c.col + 1) + ';' + pad + '">' +
          c.segments.map(function (g) {
            return g.url
              ? '<a class="info-link" href="' + esc(g.url) + '" target="_blank" rel="noopener noreferrer">' + esc(g.text) + '</a>'
              : '<span class="info-text">' + esc(g.text) + '</span>';
          }).join('') + '</div>';
      });
    });
    return head + '<div class="info-wrap"><div class="info-grid" style="grid-template-columns:repeat(' + cols + ',fit-content(320px))">' + cells + '</div></div>';
  }

  /** Загружает Info в фоне и обновляет только блок (повторный запрос не чаще, чем раз в 20 секунд). */
  function loadInfo(force) {
    if (S.infoBusy) return;
    if (!force && S.info && Date.now() - S.infoAt < 20000) return;
    S.infoBusy = true;
    authCall('getInfoData').then(function (r) { S.info = r; S.infoErr = ''; })
      .catch(function (e) { S.infoErr = e.message; })
      .then(function () {
        S.infoBusy = false; S.infoAt = Date.now();
        var b = $('#infoBlock'); if (b) b.innerHTML = infoBlockHTML();
      });
  }

  /* ---------- Реестр согласований ---------- */
  function voteSummary(id) {
    var v = S.idx.votes[id] || [];
    return { total: v.length, agree: v.filter(function (x) { return x.vote === 'Agree'; }).length, rows: v };
  }
  function votePill(v) {
    return '<span class="pill v-' + esc(String(v).replace(/\s/g, '')) + '">' + esc(enumLabel('vote', v)) + '</span>';
  }

  function registerHTML() {
    var list = S.data.entities.approval.slice().sort(function (a, b) { return String(a.deadline).localeCompare(String(b.deadline)); });
    var head = '<div class="card-head" style="padding:0 var(--card-pad)"><h4>Реестр согласований</h4><span class="small muted">Всего: ' + list.length + '</span></div>';
    if (!list.length) {
      return head + '<div class="empty"><b>Согласований пока нет</b>Создайте согласование кнопкой «Создать» и выберите участников голосования.</div>';
    }
    var rows = list.map(function (a) {
      var vs = voteSummary(a.id), open = !!S.regOpen[a.id], late = isOverdue(a);
      var r = '<tr class="reg-row' + (open ? ' open' : '') + '" data-act="reg-toggle" data-id="' + esc(a.id) + '">' +
        '<td class="nowrap"><span class="reg-caret">&#9656;</span> ' + esc(a.id) + '</td>' +
        '<td>' + esc(a.name) + '</td><td>' + esc(a.initiator) + '</td>' +
        '<td class="nowrap">' + ru(String(a.created_at).slice(0, 10)) + '</td>' +
        '<td class="nowrap' + (late ? ' log-late' : '') + '" style="' + (late ? 'color:var(--danger-ink)' : '') + '">' + ru(a.deadline) + '</td>' +
        '<td>' + pill(a) + '</td>' +
        '<td class="nowrap">' + (vs.total ? vs.agree + ' из ' + vs.total + ' согласны' : '<span class="muted">без голосования</span>') + '</td>' +
        '<td class="right"><button class="link-btn pbtn" data-act="open" data-id="' + esc(a.id) + '">Открыть</button></td></tr>';
      if (open) {
        r += '<tr class="reg-sub"><td colspan="8">' + (vs.total
          ? '<table class="tbl"><thead><tr><th>Участник</th><th>Голос</th><th>Комментарий</th><th>Дата голоса</th></tr></thead><tbody>' +
            vs.rows.map(function (v) {
              return '<tr><td>' + esc(v.voter) + '</td><td>' + votePill(v.vote) + '</td><td>' + esc(v.vote_comment || '—') +
                '</td><td class="nowrap">' + esc(v.vote_date ? fmtTs(v.vote_date) : '—') + '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<span class="muted small">Участники не назначены: статус задаётся вручную в карточке.</span>') + '</td></tr>';
      }
      return r;
    }).join('');
    return head + '<div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Название</th><th>Инициатор</th><th>Создано</th>' +
      '<th>Срок</th><th>Статус</th><th>Голоса</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderHome() {
    var d = S.data.entities, t0 = today();
    var items = progressItems();
    var total = items.length ? Math.round(items.reduce(function (s, e) { return s + effProgress(e); }, 0) / items.length) : 0;
    var all = [].concat(d.stage, d.task, d.subtask, d.approval, d.meeting);
    var overdue = all.filter(isOverdue);
    var blocked = all.filter(function (e) { return e._type !== 'meeting' && isBlocked(e) && !isDoneLike(e); });
    var pendingAp = d.approval.filter(function (a) { return a.status === 'Pending' || a.status === 'In Progress'; });

    // Задачи по статусам
    var statRows = enumOf('status').map(function (s) {
      var n = d.task.filter(function (t) { return t.status === s.value; }).length;
      var pct = d.task.length ? Math.round(n / d.task.length * 100) : 0;
      return '<div class="stat-row"><span><span class="pill s-' + s.value.replace(/\s/g, '') + '">' + esc(s.label) + '</span></span>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div><b class="right">' + n + '</b></div>';
    }).join('');

    // Ближайшие сроки: просроченные и ближайшие 14 дней
    var limit = fd(pd(t0) + 14 * DAY);
    var upcoming = all.filter(function (e) {
      var dt = dateOf(e);
      return dt && !isDoneLike(e) && dt <= limit;
    }).sort(function (a, b) { return dateOf(a).localeCompare(dateOf(b)); }).slice(0, 8);
    var upHtml = upcoming.length ? upcoming.map(function (e) {
      var late = isOverdue(e);
      return '<div class="list-item" data-act="open" data-id="' + esc(e.id) + '">' +
        '<span class="date-chip' + (late ? ' late' : '') + '">' + ru(dateOf(e)) + '</span>' +

  /** Карточка связи. Строки: кто (источник), кому (получатель), что (задача), когда (дата и статус передачи). */
  function exchangeCardHTML(c) {
    var h = c.handover, cls = { ok: 's-Done', wait: 's-Pending', bad: 's-Blocked', none: '' }[h.code] || '';
    var side = function (label, e) {

  /** Перерисовывает только список карточек (поиск и фильтр работают по уже загруженным данным). */
  function drawExchangeCards() {
    var body = $('#xcBody'); if (!body) return;
    if (S.exchErr) { body.innerHTML = '<div class="form-error">' + esc(S.exchErr) + '</div>'; return; }
    if (!S.exchCards) { body.innerHTML = '<div class="loading"><span class="spinner"></span>Загрузка связей…</div>'; return; }
    var f = S.exch.filter, q = S.exch.q.toLowerCase();
    var cards = S.exchCards.filter(function (c) {
      if (f === 'flow' && c.link_type === 'parent') return false;
      if (f !== 'flow' && f !== 'all' && c.link_type !== f) return false;
      if (!q) return true;
      return [c.source.id, c.target.id, c.source.name, c.target.name, c.source.owner, c.target.owner, c.note, c.type_label]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
    body.innerHTML = cards.length
      ? '<div class="xc-grid">' + cards.map(exchangeCardHTML).join('') + '</div>'
      : '<div class="card"><div class="empty"><b>Связей не найдено</b>Измените фильтр или нажмите «Добавить связь».</div></div>';

  /** <option> для всех объектов, сгруппированные по типам. */
  function entityOptions(selected, filterFn, emptyLabel) {
    var h = emptyLabel ? '<option value="">' + esc(emptyLabel) + '</option>' : '';
    S.meta.typeOrder.forEach(function (t) {
      var list = S.data.entities[t].filter(function (e) { return !filterFn || filterFn(e); });

      h += '<optgroup label="' + esc(typeLabel(t)) + '">' + list.map(function (e) {

  /* ============================================================================
   * ВСТРЕЧИ (календарь)
   * ========================================================================== */
  function renderMeetings() {
    var cal = S.cal, c = pd(cal.cursor), cd = new Date(c);
    var start, count, title;
    if (cal.mode === 'month') {
      var first = Date.UTC(cd.getUTCFullYear(), cd.getUTCMonth(), 1);
      var dow = (new Date(first).getUTCDay() + 6) % 7;
      var dim = new Date(Date.UTC(cd.getUTCFullYear(), cd.getUTCMonth() + 1, 0)).getUTCDate();
      start = first - dow * DAY; count = Math.ceil((dow + dim) / 7) * 7;
      title = MONTHS[cd.getUTCMonth()] + ' ' + cd.getUTCFullYear();
    } else {
      start = c - ((cd.getUTCDay() + 6) % 7) * DAY; count = 7;
      var end = start + 6 * DAY;
      title = ru(fd(start)) + ' — ' + ru(fd(end));
    }
    var byDate = {};
    S.data.entities.meeting.forEach(function (m) { (byDate[m.meeting_date] = byDate[m.meeting_date] || []).push(m); });
    Object.keys(byDate).forEach(function (k) { byDate[k].sort(function (a, b) { return String(a.meeting_time).localeCompare(String(b.meeting_time)); }); });

    var cells = '';
    for (var i = 0; i < count; i++) {
      var ms = start + i * DAY, ds = fd(ms), dd = new Date(ms);
      var other = cal.mode === 'month' && dd.getUTCMonth() !== cd.getUTCMonth();
      var evs = (byDate[ds] || []).map(function (m) {
        return '<button class="ev s-' + esc(m.status) + '" data-act="open" data-id="' + esc(m.id) + '" title="' + esc(m.name + (m.location ? ' · ' + m.location : '')) + '">' +
          '<span class="t">' + esc(m.meeting_time) + '</span>' + esc(m.name) + '</button>';
      }).join('');
      cells += '<div class="cal-day' + (other ? ' other' : '') + (ds === today() ? ' today' : '') + '" data-act="new-meeting-day" data-date="' + ds + '">' +
        '<span class="num">' + dd.getUTCDate() + '</span>' + evs + '</div>';
    }
    $('#v-meetings').innerHTML =
      '<div class="view-head"><h2>Встречи</h2><div class="toolbar">' +
      '<button class="btn sm" data-act="cal-nav" data-d="-1">&larr;</button>' +
      '<b style="min-width:170px;text-align:center">' + esc(title) + '</b>' +
      '<button class="btn sm" data-act="cal-nav" data-d="1">&rarr;</button>' +
      '<button class="btn sm" data-act="cal-today">Сегодня</button>' +
      '<div class="seg"><button class="' + (cal.mode === 'month' ? 'on' : '') + '" data-act="cal-mode" data-m="month">Месяц</button>' +
      '<button class="' + (cal.mode === 'week' ? 'on' : '') + '" data-act="cal-mode" data-m="week">Неделя</button></div>' +
      '<button class="btn primary" data-act="new" data-type="meeting">Создать встречу</button></div></div>' +
      '<p class="muted">Нажмите на день, чтобы создать встречу, или на встречу, чтобы открыть карточку.</p>' +
      '<div class="card cal ' + (cal.mode === 'week' ? 'cal-week' : '') + '">' +
      '<div class="cal-head">' + WEEKDAYS.map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div></div>';
  }

  function calNav(dir) {
    var c = pd(S.cal.cursor), d = new Date(c);
    if (S.cal.mode === 'month') S.cal.cursor = fd(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + dir, 1));

  /* ============================================================================
   * TABLE: hierarchical list stage -> tasks -> subtasks
   * ========================================================================== */
  // The first column holds every "+/-" button, so they all sit on one vertical line.
  var TBL_COLS = [
    ['', 3.5], ['Этапы', 11.5], ['Задачи', 11.5], ['Подзадачи', 11.5], ['Встречи', 11.5], ['Исполнитель', 7.5], ['Начало', 6],
    ['Окончание', 6.5], ['Комментарий / протокол', 13], ['Прогресс', 8.5], ['Документ (ссылка)', 9]
  ];
  var TBL_COL_OF = { stage: 0, task: 1, subtask: 2, meeting: 3 };   // which of the four name columns holds the name

  /** Plain-text haystack of a row for the quick filter. */
  function tblHaystack(r) {
    return [r.number, r.id, r.name, r.assignee, r.comment, r.status_label, ru(r.start_date), ru(r.finish_date)]
      .concat(r.docs.map(function (d) { return docLabel(d.name); })).join(' ').toLowerCase();
  }

  /**
   * Rows to show. A row is hidden when any of its ancestors is collapsed (all levels work the same:
   * stage -> task -> subtask -> meeting). While a filter is active, matches and their ancestors are shown expanded.
   */
  function tblVisibleRows() {
    var rows = S.tbl.rows || [], q = S.tbl.q.trim().toLowerCase(), byKey = {};
    rows.forEach(function (r) { byKey[r.key] = r; });
    var keep = null;
    if (q) {
      keep = {};
      rows.forEach(function (r) {
        if (tblHaystack(r).indexOf(q) === -1) return;
        for (var cur = r; cur && !keep[cur.key]; cur = byKey[cur.parent_id]) keep[cur.key] = true;
      });
    }
    return rows.filter(function (r) {
      if (keep) return !!keep[r.key];
      for (var p = byKey[r.parent_id]; p; p = byKey[p.parent_id]) if (S.tbl.collapsed[p.key]) return false;
      return true;
    });
  }

  function tblRowHTML(r) {
    var col = TBL_COL_OF[r.type], open = !S.tbl.collapsed[r.key] || !!S.tbl.q.trim();
    var toggle = r.has_children
      ? '<button class="tg' + (open ? ' open' : '') + '" data-act="tbl-toggle" data-id="' + esc(r.key) + '" aria-expanded="' + open +
        '" aria-label="' + (open ? 'Свернуть' : 'Развернуть') + '" title="' + (open ? 'Свернуть' : 'Развернуть') + '"><span class="tg-ico"></span></button>'
      : '';
    var nameCell = '<div class="tn">' + (r.number ? '<span class="no">' + esc(r.number) + '</span>' : '') +
      '<a href="#" data-act="open" data-id="' + esc(r.id) + '" title="' + esc(r.id) + '">' + esc(r.name) + '</a>' +
      (r.blocked ? ' <span class="pill s-Blocked">Блок</span>' : '') + '</div>';
    var tds = '';
    tds += '<td class="tg-cell">' + toggle + '</td>';              // column 0: the +/- button
    for (var i = 0; i < 4; i++) tds += '<td>' + (i === col ? nameCell : '') + '</td>';
    var dash = '<span class="muted">—</span>';
    var docs = r.docs.length ? r.docs.map(function (d) { return docHTML(d.name, d.url); }).join('') : dash;
    var dates = r.type === 'meeting'
      ? '<td class="nowrap">' + (r.start_date ? ru(r.start_date) + (r.time ? '<div class="muted small">' + esc(r.time) + '</div>' : '') : dash) + '</td><td class="nowrap">' + dash + '</td>'
      : '<td class="nowrap">' + (r.start_date ? ru(r.start_date) : dash) + '</td><td class="nowrap">' + (r.finish_date ? ru(r.finish_date) : dash) + '</td>';
    var progress = r.type === 'meeting'
      ? '<span class="pill pill-wrap s-' + esc(String(r.status).replace(/\s/g, '')) + '">' + esc(r.status_label) + '</span>'
      : '<div class="tp"><div class="bar"><i style="width:' + r.progress + '%"></i></div><b>' + r.progress + '%</b></div>';
    return '<tr class="lv-' + r.type + '" data-key="' + esc(r.key) + '">' + tds +
      '<td>' + (r.assignee ? esc(r.assignee) : dash) + '</td>' + dates +
      '<td class="cm">' + (r.comment ? esc(r.comment) : dash) + '</td>' +
      '<td>' + progress + '</td><td>' + docs + '</td></tr>';
  }

  /** Redraws only the table body (search and expand/collapse never lose input focus). */
  function drawTable() {
    var body = $('#tblBody'); if (!body) return;
    if (S.tbl.err) { body.innerHTML = '<div class="form-error">' + esc(S.tbl.err) + '</div>'; return; }
    if (!S.tbl.rows) { body.innerHTML = '<div class="loading"><span class="spinner"></span>Загрузка…</div>'; return; }

    body.innerHTML = '<div class="table-wrap"><table class="tbl tbl-tree"><colgroup>' +

      rows.map(tblRowHTML).join('') + '</tbody></table></div>';

  function renderTable() {
    $('#v-table').innerHTML =
      '<div class="view-head"><h2>Таблица</h2><div class="toolbar">' +

  /* ============================================================================
   * КАНБАН
   * Колонки: В процессе / Планируются / Готово / Ожидают решения (просроченные).
   * Перетаскивание на pointer-событиях (мышь и касание), статус сохраняется на сервере (moveTask).
   * ========================================================================== */
  var KB_COLS = [
    { id: 'progress', title: 'В процессе', empty: 'Элементов в работе нет' },
    { id: 'planned', title: 'Планируются', empty: 'Запланированных элементов нет' },
    { id: 'done', title: 'Готово', empty: 'Завершённых элементов пока нет' },
    { id: 'awaiting', title: 'Ожидают решения', empty: 'Просроченных элементов нет' }
  ];
  var KB_STATUS = { progress: 'In Progress', planned: 'Not Started', done: 'Done' };

  /** Колонка задачи: просрочка (срок прошёл, не «Готово») важнее статуса. */
  function kbColumn(t) {
    if (t.status === 'Done') return 'done';
    if (t.deadline && t.deadline < today()) return 'awaiting';
    if (t.status === 'Not Started') return 'planned';
    return 'progress';
  }

  var KB_TYPES = [['all', 'Все'], ['stage', 'Этапы'], ['task', 'Задачи'], ['subtask', 'Подзадачи']];
  var KB_SHORT = { stage: 'Эт.', task: 'Зад.', subtask: 'Подз.' };

  /** Work items shown on the board: stages, tasks and subtasks (optionally filtered by type). */
  function kbItems() {
    var d = S.data.entities, all = [].concat(d.stage, d.task, d.subtask);
    return S.kb.type === 'all' ? all : all.filter(function (e) { return e._type === S.kb.type; });
  }

  function kbCardHTML(t) {
    var late = isOverdue(t), blk = isBlocked(t) && t.status !== 'Done', pct = effProgress(t);
    var days = late ? Math.round((pd(today()) - pd(t.deadline)) / DAY) : 0;
    var tip = t.id + ' · ' + t.name + (t.description ? '\n' + t.description : '') + (blk ? '\nБлокировка: ' + (t.block_reason || 'причина не указана') : '');
    return '<div class="k-card t-' + t._type + (blk ? ' blocked' : '') + (late ? ' late' : '') + '" data-act="open" data-id="' + esc(t.id) + '" title="' + esc(tip) + '">' +
      '<span class="k-grip" aria-hidden="true"></span>' +
      '<div class="k-type">' + typeTag(t._type) + '<span class="muted small">' + esc(t.id) + '</span></div>' +
      '<div class="k-title">' + esc(t.name) + '</div>' +
      '<div class="k-meta"><span>' + esc(t.assignee || 'Не назначен') + '</span>' +
      '<span class="' + (late ? 'late' : '') + '">' + (t.deadline ? ru(t.deadline) : 'без срока') + (late ? ' · +' + days + ' дн.' : '') + '</span></div>' +
      '<div class="k-prog"><div class="bar"><i style="width:' + pct + '%"></i></div><b>' + pct + '%</b></div>' +
      ((blk || t.status === 'Under Review')
        ? '<div class="k-flags">' + (blk ? '<span class="pill s-Blocked">Блок</span>' : '') +
          (t.status === 'Under Review' ? '<span class="pill s-UnderReview">На проверке</span>' : '') + '</div>' : '') +
      '</div>';
  }

  function renderKanban() {
    var cols = {};
    KB_COLS.forEach(function (c) { cols[c.id] = []; });
    kbItems().forEach(function (t) { cols[kbColumn(t)].push(t); });
    var byDeadline = function (a, b) { return String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')); };
    $('#v-kanban').innerHTML =
      '<div class="view-head"><h2>Канбан</h2><div class="toolbar">' +
      '<div class="seg">' + KB_TYPES.map(function (t) {
        return '<button class="' + (S.kb.type === t[0] ? 'on' : '') + '" data-act="kb-filter" data-t="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<button class="btn primary" data-act="new" data-type="task">Новая задача</button></div></div>' +
      '<p class="view-lead">Этапы, задачи и подзадачи. Перетаскивайте карточки между колонками — статус сохранится автоматически. ' +
      'В «Ожидают решения» попадают просроченные незавершённые элементы.</p>' +
      '<div class="kb" id="kb">' + KB_COLS.map(function (c) {
        var list = cols[c.id].sort(byDeadline);
        var split = ['stage', 'task', 'subtask'].map(function (t) {
          var n = list.filter(function (e) { return e._type === t; }).length;
          return n ? KB_SHORT[t] + ' ' + n : '';
        }).filter(Boolean).join(' · ');
        return '<div class="kb-col" data-col="' + c.id + '"><div class="kb-head"><h3><span class="kb-dot"></span>' + c.title +
          '</h3><span class="kb-count" title="' + esc(split) + '">' + list.length + '</span></div>' +
          '<div class="kb-split">' + (S.kb.type === 'all' && split ? esc(split) : '&nbsp;') + '</div><div class="kb-body">' +
          (list.length ? list.map(kbCardHTML).join('') : '<div class="kb-empty">' + c.empty + '</div>') + '</div></div>';
      }).join('') + '</div>';
  }

  /* ---------- Перетаскивание ---------- */
  var drag = null;

  function dragStart(ev) {
    var card = ev.target.closest && ev.target.closest('.k-card');
    if (!card || ev.button > 0 || S.tab !== 'kanban') return;
    // мышью тянем за любое место карточки, пальцем — только за «ручку» (чтобы колонка прокручивалась)
    if (ev.pointerType !== 'mouse' && !ev.target.closest('.k-grip')) return;
    drag = { card: card, id: card.getAttribute('data-id'), from: card.closest('.kb-col').getAttribute('data-col'),
      sx: ev.clientX, sy: ev.clientY, active: false, ghost: null, over: null };
  }

  function dragMove(ev) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 8) return;
      drag.active = true;
      var r = drag.card.getBoundingClientRect();
      drag.dx = ev.clientX - r.left; drag.dy = ev.clientY - r.top;
      var g = drag.card.cloneNode(true);
      g.className += ' k-ghost'; g.style.width = r.width + 'px';
      document.body.appendChild(g);
      drag.ghost = g;
      drag.card.classList.add('k-dragging');
      document.body.style.userSelect = 'none';
    }
    ev.preventDefault();
    drag.ghost.style.left = (ev.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (ev.clientY - drag.dy) + 'px';
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var col = el && el.closest ? el.closest('.kb-col') : null;
    $$('.kb-col').forEach(function (c) { c.classList.remove('k-over', 'k-deny'); });
    drag.over = col ? col.getAttribute('data-col') : null;
    if (col && drag.over !== drag.from) col.classList.add(drag.over === 'awaiting' ? 'k-deny' : 'k-over');
  }

  function dragEnd(ev, cancelled) {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.active) return;
    if (d.ghost) d.ghost.remove();
    d.card.classList.remove('k-dragging');
    document.body.style.userSelect = '';
    $$('.kb-col').forEach(function (c) { c.classList.remove('k-over', 'k-deny'); });
    S.noClick = true; setTimeout(function () { S.noClick = false; }, 0);   // отпускание не должно открывать карточку
    if (!cancelled) dropCard(d.id, d.from, d.over);
  }

  /** Перенос карточки: сразу обновляем интерфейс, при ошибке сервера возвращаем прежнее состояние. */
  function dropCard(id, from, to) {
    if (!to || to === from) return;
    if (to === 'awaiting') {
      toast('Колонка «Ожидают решения» заполняется автоматически: сюда попадают просроченные элементы', true);
      return;
    }
    var e = S.idx.byId[id]; if (!e) return;
    var prev = { status: e.status, progress: e.progress };
    e.status = KB_STATUS[to];
    if (to === 'done') e.progress = 100;
    renderKanban();
    var moved = $('.k-card[data-id="' + id + '"]'); if (moved) moved.classList.add('k-flash');
    authCall('moveTask', id, to).then(function (res) {
      toast(res.overdue
        ? 'Статус обновлён, но срок прошёл: задача остаётся в «Ожидают решения». Перенесите срок в карточке.'
        : 'Статус изменён: ' + enumLabel('status', KB_STATUS[to]));
      return reload();
    }).catch(function (err) {
      e.status = prev.status; e.progress = prev.progress;
      renderKanban();
      toast(err.message, true);
    });
  }

  /* ============================================================================
   * ДИАГРАММА ГАНТА
   * Ортогональные скруглённые коннекторы со стрелками, три стиля связей, подсветка цепочки,
   * плавный масштаб ползунком, фильтр «Блокирующие», ромбы согласований.
   * ========================================================================== */
  var ROW_H = 52, GROUP_H = 34;           // keep ROW_H in sync with --row-h in the styles
  var LW_MIN = 200, LW_MAX = 720;
  var DW_MIN = 1.5, DW_MAX = 80, DW_DEFAULT = 24;      // пикселей на день: обзор проекта ... детали по дням

  /** Стили коннекторов: блокировка — сплошная, передача информации — штрих, согласование — точки. */
  var LINK_STYLE = {
    blocks: { color: '#3e424f', dash: '', width: 1.8, arrow: true },
    handoff: { color: '#ff7f57', dash: '7 4', width: 1.8, arrow: true },
    approval: { color: '#7b61a5', dash: '0.1 5', width: 2.6, arrow: true, cap: 'round' },
    related: { color: '#a0b2c0', dash: '3 5', width: 1.2, arrow: false }
  };
  var DIRECTED = { blocks: true, handoff: true, approval: true };    // связи, образующие цепочку зависимостей

  function dwFromSlider(v) { return DW_MIN * Math.pow(DW_MAX / DW_MIN, v / 100); }
  function sliderFromDw(dw) { return Math.round(Math.log(dw / DW_MIN) / Math.log(DW_MAX / DW_MIN) * 100); }

  function spanOf(e) {
    var end = pd(e.deadline);
    if (isNaN(end)) return null;
    if (e._type === 'approval') return { s: end, e: end };
    var st = pd(e.start_date);
    if (isNaN(st)) st = pd((e.created_at || '').slice(0, 10));
    if (isNaN(st) || st > end) st = end;
    return { s: st, e: end };
  }

  /** Stable sort key shared by the rows and the numbering. */
  function ganttKey(e) { return String(e.start_date || e.deadline || '') + e.id; }
  function ganttSort(a, b) { return ganttKey(a) < ganttKey(b) ? -1 : 1; }

  /**
   * Only stages are numbered (1., 2., 3., ...). Tasks and subtasks are shown through the "+" expander instead.
   * Computed on the FULL list of stages, so filters and zoom never renumber them.
   */
  function ganttNumbers() {
    var nums = {};
    S.data.entities.stage.slice().sort(ganttSort).forEach(function (st, i) { nums[st.id] = (i + 1) + '.'; });
    return nums;
  }

  /** "+" / "−" button, always at the left edge of the label column. */
  function gTg(e) {
    if (!ganttHasKids(e)) return '';
    var open = !S.gantt.collapsed[e.id];
    return '<button class="tg g-tg' + (open ? ' open' : '') + '" data-act="g-toggle" data-id="' + esc(e.id) + '" aria-expanded="' + open +
      '" aria-label="' + (open ? 'Свернуть' : 'Развернуть') + '" title="' + (open ? 'Свернуть' : 'Развернуть') + '"><span class="tg-ico"></span></button>';
  }

  /** Range sliders: the filled part is orange, the rest of the line stays white (the --fill variable drives the gradient). */
  function rangeFill(el) {
    var min = Number(el.min) || 0, max = Number(el.max) || 100, v = Number(el.value) || 0;
    el.style.setProperty('--fill', Math.max(0, Math.min(100, (v - min) / (max - min) * 100)) + '%');
  }
  function syncRanges() { $$('input[type=range]').forEach(rangeFill); }

  /** Does the item have nested rows (tasks, subtasks, approvals)? Meetings are not part of the Gantt. */
  function ganttHasKids(e) {
    return (S.idx.children[e.id] || []).some(function (id) { var k = S.idx.byId[id]; return k && k._type !== 'meeting'; });
  }

  /** Drops rows whose ancestor is collapsed with the "+" button. */
  function visibleGanttRows(rows) {
    var out = rows.filter(function (r) {
      if (r.group) return true;
      for (var p = S.idx.parent[r.e.id]; p; p = S.idx.parent[p]) if (S.gantt.collapsed[p]) return false;
      return true;
    });
    out.blocked = rows.blocked;
    return out;
  }

  /** Строки диаграммы: этапы -> задачи -> подзадачи/согласования. В режиме «Блокирующие» остаются заблокированные и (приглушённо) соседи. */
  function ganttRows() {
    var rows = [];
    var sortFn = ganttSort;
    var kids = function (id) {
      return (S.idx.children[id] || []).map(function (i) { return S.idx.byId[i]; })
        .filter(function (e) { return e && e._type !== 'meeting'; }).sort(sortFn);
    };
    function walk(e, depth) { rows.push({ e: e, depth: depth }); kids(e.id).forEach(function (k) { walk(k, depth + 1); }); }
    S.data.entities.stage.slice().sort(sortFn).forEach(function (s) { walk(s, 0); });
    [['task', 'Задачи без этапа'], ['subtask', 'Подзадачи без задачи'], ['approval', 'Согласования без привязки']].forEach(function (g) {
      var list = S.data.entities[g[0]].filter(function (e) { return !S.idx.byId[S.idx.parent[e.id]]; }).sort(sortFn);
      if (!list.length) return;
      rows.push({ group: g[1] });
      list.forEach(function (e) { walk(e, 1); });
    });

    var bl = {};
    if (S.gantt.blockOnly) {
      var keep = {}, ctx = {};
      var work = function (e) { return e && e._type !== 'meeting'; };
      var addAncestors = function (id) {
        var cur = S.idx.parent[id];
        while (cur && S.idx.byId[cur]) { if (!keep[cur]) { keep[cur] = true; ctx[cur] = true; } cur = S.idx.parent[cur]; }
      };
      [].concat(S.data.entities.stage, S.data.entities.task, S.data.entities.subtask, S.data.entities.approval).forEach(function (e) {
        if (isBlocked(e) && !isDoneLike(e)) { bl[e.id] = true; keep[e.id] = true; ctx[e.id] = false; }
      });
      if (S.gantt.deps) {                     // dependencies on: blocked items keep their immediate neighbours (dimmed)
        S.data.links.forEach(function (l) {
          if (l.link_type === 'parent') return;
          [[l.source_id, l.target_id], [l.target_id, l.source_id]].forEach(function (p) {
            if (bl[p[0]] && work(S.idx.byId[p[1]]) && !keep[p[1]]) { keep[p[1]] = true; ctx[p[1]] = true; }
          });
        });
      }
      Object.keys(keep).forEach(addAncestors);
      rows = rows.filter(function (r) { return r.group || keep[r.e.id]; });
      rows.forEach(function (r) { if (!r.group) r.ctx = !!ctx[r.e.id]; });
      // убираем заголовки групп без строк
      rows = rows.filter(function (r, i) { return !r.group || (rows[i + 1] && !rows[i + 1].group); });
    }
    rows.blocked = bl;
    return rows;
  }

  /** Скруглённая ломаная: углы сглаживаются квадратичными кривыми. */
  function roundedPath(pts, r) {
    var p = pts.filter(function (a, i) { return !i || a[0] !== pts[i - 1][0] || a[1] !== pts[i - 1][1]; });
    var d = 'M' + p[0][0] + ' ' + p[0][1];
    for (var i = 1; i < p.length - 1; i++) {
      var a = p[i - 1], b = p[i], c = p[i + 1];
      var l1 = Math.hypot(a[0] - b[0], a[1] - b[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
      var rr = Math.min(r, l1 / 2, l2 / 2);
      d += ' L' + (b[0] + (a[0] - b[0]) / l1 * rr) + ' ' + (b[1] + (a[1] - b[1]) / l1 * rr) +
        ' Q' + b[0] + ' ' + b[1] + ' ' + (b[0] + (c[0] - b[0]) / l2 * rr) + ' ' + (b[1] + (c[1] - b[1]) / l2 * rr);
    }
    var z = p[p.length - 1];
    return d + ' L' + z[0] + ' ' + z[1];
  }

  /** Коннектор от правого края источника (x1,y1) к левому краю получателя (x2,y2). */
  function elbow(x1, y1, x2, y2) {
    var g = 12, pts;
    if (Math.abs(y1 - y2) < 1) pts = [[x1, y1], [x2, y2]];
    else if (x2 >= x1 + 2 * g) {
      var xv = x1 + Math.min(g * 1.5, (x2 - x1) / 2);
      pts = [[x1, y1], [xv, y1], [xv, y2], [x2, y2]];
    } else {                                     // получатель начинается раньше окончания источника — обходим по границе строк
      var ym = y1 + (y2 > y1 ? ROW_H / 2 : -ROW_H / 2);
      pts = [[x1, y1], [x1 + g, y1], [x1 + g, ym], [x2 - g, ym], [x2 - g, y2], [x2, y2]];
    }
    return roundedPath(pts, 7);
  }

  /** Цепочка зависимостей: все предшественники и последователи (через направленные связи). */
  function chainOf(ids) {
    var nodes = {}, links = {}, stack = ids.slice();
    ids.forEach(function (i) { nodes[i] = true; });
    [['target_id', 'source_id'], ['source_id', 'target_id']].forEach(function (dir) {   // вверх по потоку, затем вниз
      var seen = {}, st = ids.slice();
      while (st.length) {
        var cur = st.pop();
        if (seen[cur]) continue; seen[cur] = true;
        S.data.links.forEach(function (l) {
          if (!DIRECTED[l.link_type] || l[dir[0]] !== cur) return;
          links[l.link_id] = true; nodes[l[dir[1]]] = true; st.push(l[dir[1]]);
        });
      }
    });
    return { nodes: nodes, links: links, stack: stack };
  }

  function applyChain(ids) {
    var cv = $('.g-canvas'); if (!cv) return;
    $$('.hl', cv).forEach(function (x) { x.classList.remove('hl'); });
    cv.classList.remove('chain-on');
    if (!S.gantt.deps || !ids || !ids.length) return;       // no connectors drawn -> no chain to highlight
    var ch = chainOf(ids);
    if (!Object.keys(ch.links).length) return;           // у изолированного объекта подсвечивать нечего
    cv.classList.add('chain-on');
    $$('[data-id]', cv).forEach(function (el) { if (ch.nodes[el.getAttribute('data-id')]) el.classList.add('hl'); });
    $$('[data-lid]', cv).forEach(function (el) { if (ch.links[el.getAttribute('data-lid')]) el.classList.add('hl'); });
  }

  function voteBadge(a) {
    var vs = voteSummary(a.id);
    return vs.total ? ' · ' + vs.agree + '/' + vs.total : '';
  }

  /** Каркас вкладки: панель управления (не перерисовывается при масштабировании) и область диаграммы. */
  function renderGantt(keepScroll) {
    var sc = $('#gScroll');
    var prev = keepScroll && sc ? { l: sc.scrollLeft, t: sc.scrollTop } : null;
    var g = S.gantt;
    $('#v-gantt').innerHTML =
      '<div class="view-head"><h2>Диаграмма Ганта</h2><div class="toolbar"><button class="btn sm" data-act="g-today">Сегодня</button></div></div>' +
      '<div class="g-bar-top">' +
      '<div class="zoom-ctl"><span class="zl">Весь проект</span>' +
      '<input type="range" id="gZoom" min="0" max="100" step="1" value="' + sliderFromDw(g.dw) + '" aria-label="Масштаб диаграммы">' +
      '<span class="zl">По дням</span>' +
      '<button class="btn sm" data-act="g-fit" title="Уместить весь проект по ширине">Уместить</button>' +
      '<button class="btn sm" data-act="g-reset" title="Вернуть масштаб по умолчанию">Сбросить</button></div>' +
      '<label class="toggle"><input type="checkbox" id="gBlock"' + (g.blockOnly ? ' checked' : '') + '><span class="sw"></span>Блокирующие</label>' +
      '<label class="toggle"><input type="checkbox" id="gDeps"' + (g.deps ? ' checked' : '') + '><span class="sw"></span>С зависимостями</label>' +
      '<button class="btn sm" data-act="g-all" data-open="1" title="Развернуть все строки">Развернуть всё</button>' +
      '<button class="btn sm" data-act="g-all" data-open="0" title="Свернуть все строки">Свернуть всё</button>' +
      '<button class="btn sm" data-act="g-col-expand" id="gColBtn" title="Ширина колонки «Структура проекта»">' + (g.lw ? 'Сбросить ширину колонки' : 'Развернуть колонку') + '</button>' +
      '</div>' +
      '<div class="legend">' +
      '<span class="it"><span class="lg-bar stage"></span>Этап</span>' +
      '<span class="it"><span class="lg-bar planned"></span>Запланировано</span>' +
      '<span class="it"><span class="lg-bar"></span>В процессе (заливка — прогресс)</span>' +
      '<span class="it"><span class="lg-bar done"></span>Готово</span>' +
      '<span class="it"><span class="lg-bar overdue"></span>Просрочено</span>' +
      '<span class="it"><span class="lg-bar blocked"></span>Заблокировано</span>' +
      '<span class="it"><span class="lg-dia"></span>Требуется решение</span>' +
      '<span class="it"><span class="lg-dia ok"></span>Согласовано</span>' +
      '<span class="it"><span class="lg-dia bad"></span>Отклонено</span>' +
      '<span class="it"><span class="lg-line blocks"></span>Блокирует</span>' +
      '<span class="it"><span class="lg-line handoff"></span>Передаёт информацию</span>' +
      '<span class="it"><span class="lg-line approval"></span>Согласование</span>' +
      '<span class="it"><span class="lg-line related"></span>Связан</span>' +
      '<span class="it"><span class="lg-today"></span>Сегодня</span></div>' +
      '<div class="card g-card"><div id="gChart"></div><div class="g-tip" id="gTip" hidden></div></div>';
    drawGantt({ scroll: prev });
  }

  /** Рисует диаграмму. opts.scroll — вернуть позицию прокрутки; opts.recenter — сохранить дату в центре экрана при смене масштаба. */
  function drawGantt(opts) {
    opts = opts || {};
    var root = $('#gChart'); if (!root) return;
    var sc0 = $('#gScroll'), g = S.gantt;
    var anchor = null;
    if (opts.recenter && sc0 && g.drawnDw) anchor = (sc0.scrollLeft + sc0.clientWidth / 2 - g.LW) / g.drawnDw;

    var rows = visibleGanttRows(ganttRows()), bl = rows.blocked;
    var LW = curLW();
    var t0 = pd(today()), min = Infinity, max = -Infinity;
    rows.forEach(function (r) {
      if (r.group) return;
      r.sp = spanOf(r.e);
      if (r.sp) { min = Math.min(min, r.sp.s); max = Math.max(max, r.sp.e); }
    });
    if (min === Infinity) { min = t0; max = t0 + 30 * DAY; }
    min = Math.min(min, t0) - 3 * DAY; max = Math.max(max, t0) + 10 * DAY;
    min -= ((new Date(min).getUTCDay() + 6) % 7) * DAY;           // начало недели — понедельник

    var dayW = g.dw;

      var e = r.e, sp = r.sp, bar = '', late = isOverdue(e), blk = isBlocked(e) && !isDoneLike(e), pct = effProgress(e);
      var yc = y + ROW_H / 2, id = esc(e.id);
      var tip = e.id + ' · ' + e.name + '\n' + statusLabel(e) + (ownerOf(e) ? ' · ' + ownerOf(e) : '') +
        (sp ? '\n' + ru(fd(sp.s)) + ' — ' + ru(fd(sp.e)) : '') + (blk ? '\nБлокировка: ' + (e.block_reason || '') : '');
      if (sp && e._type === 'approval') {

        '<div class="nm">' + (nums[e.id] ? '<span class="g-num">' + nums[e.id] + '</span>' : '') + typeTag(e._type) + '<span class="nm-t">' + esc(e.name) + '</span></div>' +
        '<div class="sub">' + flags.trim() + (flags ? ' ' : '') + esc(sub) + '</div></div>' +   // status flags sit on the second line so they never squeeze the name

    });
    var H = y;

    // Коннекторы
    var paths = '';
    S.data.links.forEach(function (l) {

      marker('approval', LINK_STYLE.approval.color) + marker('conflict', '#b75947') + '</defs>' + paths + '</svg>';
    var todayLine = '<div class="g-today" style="left:calc(var(--lw) + ' + (X(t0) + dayW / 2) + 'px)"></div>';

    root.innerHTML = '<div class="g-scroll" id="gScroll"><div class="g-canvas" style="--lw:' + LW + 'px;--tw:' + W + 'px;width:calc(var(--lw) + var(--tw))">' +
      '<div class="g-head"><div class="g-corner">Структура проекта<div class="g-resizer" id="gResizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Ширина колонки: потяните границу" title="Потяните границу, чтобы изменить ширину"></div></div><div class="g-timehead" style="width:' + W + 'px">' +
      '<div class="g-months">' + monthsHtml + '</div><div class="g-days">' + lower + '</div></div></div>' +

  /* ---------- "Project structure" column width: drag, keyboard, expand to fit; persisted ---------- */
  function lwDefault() { return window.innerWidth <= 760 ? 200 : 320; }
  function curLW() {
    var v = S.gantt.lw || lwDefault();
    return Math.max(LW_MIN, Math.min(v, LW_MAX, Math.max(LW_MIN, window.innerWidth - 140)));
  }
  /** Applies a new width live through the CSS variable (no redraw) and optionally stores it. */
  function setLW(px, persist) {
    px = Math.round(Math.max(LW_MIN, Math.min(LW_MAX, px)));
    var cv = $('.g-canvas'); if (cv) cv.style.setProperty('--lw', px + 'px');
    S.gantt.LW = px;
    if (persist) {
      S.gantt.lw = px === lwDefault() ? 0 : px;
      lsSet('ec2_gantt_lw', S.gantt.lw || null);
      var b = $('#gColBtn'); if (b) b.textContent = S.gantt.lw ? 'Сбросить ширину колонки' : 'Развернуть колонку';
    }

  /** Width needed to show the longest visible name on one line (measured with the label font). */
  function fitLW() {
    var ctx = document.createElement('canvas').getContext('2d'), widest = 0, nums = ganttNumbers();
    ctx.font = '500 13px Inter, -apple-system, "Segoe UI", sans-serif';
    ganttRows().forEach(function (r) {
      if (r.group) return;
      var e = r.e, w = 40 + r.depth * 16 + 12 + ctx.measureText(e.name).width + 78;      // indent + tag + paddings
      if (nums[e.id]) w += ctx.measureText(nums[e.id]).width + 8;
      if (isBlocked(e) && !isDoneLike(e)) w += 52;
      if (isOverdue(e)) w += 92;
      widest = Math.max(widest, w);
    });
    return Math.ceil(widest);
  }
  var gResize = null;

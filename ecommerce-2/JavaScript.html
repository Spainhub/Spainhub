      '</div>' +
      '<div class="drawer-foot"><div>' + (e ? '<button class="btn danger" data-act="ent-delete">Удалить</button>' : '') + '</div>' +
      '<div style="display:flex;gap:8px"><button class="btn" data-act="close-drawer">Закрыть</button><button class="btn primary" data-act="ent-save">' + (e ? 'Сохранить' : 'Создать') + '</button></div></div>';

    $('#scrim').hidden = false;
    $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false');
    syncShowIf(); syncProgress();
    S.gantt.sel = id || null;
    if (S.tab === 'gantt') applyChain(id ? [id] : null);          // цепочка зависимостей выбранного объекта
    if (!e) { fillLinkTargets(type); } else {
      renderDrawerSections();
      authCall('getLog', { entity_id: id, limit: 15 }).then(function (r) {
        var h = $('#histList'); if (!h || !S.drawer || S.drawer.id !== id) return;
        h.innerHTML = r.rows.length ? r.rows.map(function (x) {
          return '<div class="hist-item"><span class="when">' + esc(fmtTs(x.timestamp)) + '</span><b>' + esc(x.user) + '</b> · ' + esc(describeLog(x)) + '</div>';
        }).join('') : '<div class="muted small">Изменений нет</div>';
      }).catch(function () { });
    }
    var first = $('#f_name'); if (first && !e) first.focus();
  }

  function closeDrawer() {
    S.drawer = null;
    S.gantt.sel = null;
    if (S.tab === 'gantt') applyChain(null);
    $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true');
    $('#scrim').hidden = true;
  }

  /** Разделы карточки, зависящие от данных: родитель, документы, связи. */
  function renderDrawerSections() {
    var d = S.drawer; if (!d || !d.id) return;
    var e = S.idx.byId[d.id]; if (!e) { closeDrawer(); return; }
    var cfg = S.meta.types[d.type];

    var sp = $('#secParent');
    if (sp) {
      var kids = (S.idx.children[e.id] || []).map(function (i) { return S.idx.byId[i]; }).filter(Boolean);
      sp.innerHTML = (cfg.parents.length
        ? '<h4>Родитель</h4><select id="parentSel">' + entityOptions(S.idx.parent[e.id], function (x) { return cfg.parents.indexOf(x._type) !== -1; }, 'Без родителя') + '</select>'
        : '') +
        (kids.length ? '<h4 style="margin-top:14px">Входит в состав</h4>' + kids.map(function (k) {
          return '<div class="link-item"><div class="grow">' + typeTag(k._type) + ' ' + esc(k.name) + '</div><button class="link-btn pbtn" data-act="open" data-id="' + esc(k.id) + '">Открыть</button></div>';
        }).join('') : '');
      if (!cfg.parents.length && !kids.length) sp.hidden = true; else sp.hidden = false;
    }

    var vsec = $('#secVotes');
    if (vsec) vsec.innerHTML = votesSectionHTML(e);

    var docs = S.idx.docs[e.id] || [];
    $('#docList').innerHTML = docs.length ? docs.map(function (x) {
      return '<div class="doc-item"><div class="grow">' + docHTML(x.doc_name, x.doc_url) + '</div>' +
        '<button class="link-btn" data-act="doc-edit" data-id="' + esc(x.doc_id) + '">Изменить</button>' +
        '<button class="link-btn danger" data-act="doc-del" data-id="' + esc(x.doc_id) + '">Удалить</button></div>';
    }).join('') : '<div class="muted small">Документов нет</div>';

    var links = S.data.links.filter(function (l) { return l.source_id === e.id || l.target_id === e.id; });
    $('#linkList').innerHTML = links.length ? links.map(function (l) {
      var out = l.source_id === e.id, other = out ? l.target_id : l.source_id, o = S.idx.byId[other];
      var verb = l.link_type === 'parent' ? (out ? 'Входит в' : 'Включает')
        : l.link_type === 'handoff' ? (out ? 'Передаёт информацию →' : 'Получает информацию от')
        : l.link_type === 'blocks' ? (out ? 'Блокирует →' : 'Блокируется')
        : l.link_type === 'approval' ? (out ? 'Требует согласования →' : 'Согласование для') : 'Связан с';
      return '<div class="link-item"><div class="grow"><span class="muted">' + verb + '</span> <a href="#" data-act="open" data-id="' + esc(other) + '">' +
        esc(other) + '</a> ' + esc(o ? o.name : '') + '</div>' +
        '<button class="link-btn danger" data-act="link-del" data-id="' + esc(l.link_id) + '">Удалить</button></div>';
    }).join('') : '<div class="muted small">Связей нет</div>';
  }

  /** Список объектов для связи в форме создания (для «Входит в» — только допустимые родители). */
  function fillLinkTargets(type) {
    var sel = $('#cLinkTarget'), lt = $('#cLinkType').value, parents = S.meta.types[type].parents;
    var filt = null;
    if (lt === 'parent') filt = function (e) { return parents.indexOf(e._type) !== -1; };
    else if (lt === 'approval_out') filt = function (e) { return e._type === 'approval'; };
    else if (lt === 'approval_in') filt = function (e) { return ['stage', 'task', 'subtask'].indexOf(e._type) !== -1; };
    sel.innerHTML = entityOptions('', filt, 'Без связи');
  }

  /** Мультивыбор участников голосования из Users (+ добавление нового имени). */
  function votersWidgetHTML(selected) {
    var names = S.data.users.map(function (u) { return u.name; });
    selected.forEach(function (n) { if (names.indexOf(n) === -1) names.push(n); });
    var sel = {}; selected.forEach(function (n) { sel[n.toLowerCase()] = true; });
    return '<div class="field full" data-field="voters"><label>Участники голосования <span class="req">*</span></label>' +
      '<div class="voters-box" id="votersBox">' + (names.length ? names.map(function (n) { return voterOptHTML(n, !!sel[n.toLowerCase()]); }).join('')
        : '<span class="hint">Список пользователей пуст — добавьте участника ниже.</span>') + '</div>' +
      '<div class="voter-add"><input type="text" id="voterNew" list="usersList" placeholder="Добавить участника по имени" autocomplete="off">' +
      '<button type="button" class="btn sm" data-act="voter-add">Добавить</button></div></div>';
  }
  function voterOptHTML(n, checked) {
    return '<label class="voter-opt"><input type="checkbox" value="' + esc(n) + '"' + (checked ? ' checked' : '') + '><span title="' + esc(n) + '">' + esc(n) + '</span></label>';
  }
  function collectVoters() {
    return $$('#votersBox input:checked').map(function (c) { return c.value; });
  }
  function addVoterFromInput() {
    var inp = $('#voterNew'), box = $('#votersBox'); if (!inp || !box) return;
    var n = inp.value.trim(); if (!n) return;
    var exist = $$('#votersBox input').filter(function (c) { return c.value.toLowerCase() === n.toLowerCase(); })[0];
    if (exist) exist.checked = true;
    else { var hint = $('.hint', box); if (hint) hint.remove(); box.insertAdjacentHTML('beforeend', voterOptHTML(n, true)); }
    inp.value = '';
  }

  /** Раздел «Голосование» в карточке согласования: голоса всех участников, свой голос можно изменить. */
  function votesSectionHTML(e) {
    var vs = voteSummary(e.id);
    if (!vs.total) {
      return '<h4>Голосование</h4><div class="muted small">Участники не назначены. Отметьте их в блоке «Участники голосования» и сохраните — статус будет определяться голосами.</div>';
    }
    var me = String(S.user).toLowerCase();
    var hasMe = vs.rows.some(function (v) { return v.voter.toLowerCase() === me; });
    return '<h4>Голосование</h4><p class="small muted">Итог: ' + pill(e) + ' · ' + vs.agree + ' из ' + vs.total + ' согласны. ' +
      (hasMe ? '' : 'Вы не участник голосования: войдите под именем участника, чтобы проголосовать.') + '</p>' +
      vs.rows.map(function (v) {
        var mine = v.voter.toLowerCase() === me;
        var when = v.vote_date ? '<div class="cmt">' + esc(fmtTs(v.vote_date)) + '</div>' : '';
        if (!mine) {
          return '<div class="vote-row"><span class="who">' + esc(v.voter) + '</span>' + votePill(v.vote) +
            (v.vote_comment ? '<div class="cmt">' + esc(v.vote_comment) + '</div>' : '') + when + '</div>';
        }
        return '<div class="vote-row me"><span class="who">' + esc(v.voter) + ' (вы)</span>' + votePill(v.vote) +
          '<div class="vote-form"><select id="voteSel" aria-label="Ваш голос">' + enumOf('vote').map(function (o) {
            return '<option value="' + esc(o.value) + '"' + (o.value === v.vote ? ' selected' : '') + '>' + esc(o.label) + '</option>';
          }).join('') + '</select><input type="text" id="voteComment" maxlength="1000" placeholder="Комментарий (необязательно)" value="' + esc(v.vote_comment) + '">' +
          '<button class="btn primary sm" data-act="vote-cast">Проголосовать</button></div>' + when + '</div>';
      }).join('');
  }

  function castVote() {
    var d = S.drawer; if (!d || !d.id) return;
    authCall('castVote', d.id, S.user, $('#voteSel').value, $('#voteComment').value).then(function (r) {
      toast(r.changed ? 'Голос учтён. Статус: ' + enumLabel('approval_status', r.status) : 'Голос не изменился');
      return reload();
    }).catch(function (er) { toast(er.message, true); });
  }

  function syncShowIf() {
    var blocked = $('#f_blocked');
    $$('[data-showif]').forEach(function (el) {
      var k = el.getAttribute('data-showif'), cb = $('#f_' + k);
      el.hidden = !(cb && cb.checked);
    });
    return blocked;
  }

  function syncProgress() {
    var n = $('#f_progress'); if (!n) return;
    var v = Math.max(0, Math.min(100, Number(n.value) || 0));
    var bar = $('#progBar'); if (bar) bar.style.width = v + '%';
    syncRanges();
    var d = S.drawer && S.drawer.id ? S.idx.byId[S.drawer.id] : null;
    var hint = $('#progHint');
    if (hint && d) {
      var eff = effProgress(d);
      hint.textContent = (S.idx.children[d.id] || []).length && (d._type === 'stage' || d._type === 'task')
        ? 'Итог по дочерним элементам: ' + eff + '%. Собственное значение используется, пока их нет.' : '';
    }
  }

  function collectForm(cfg) {
    var out = {};
    cfg.fields.forEach(function (f) {
      var el = $('#f_' + f.key); if (!el) return;
      out[f.key] = f.type === 'bool' ? el.checked : el.value;
    });
    return out;
  }

  function formError(msg) {
    var b = $('#formErr'); if (!b) return;
    b.hidden = !msg; b.textContent = msg || '';
    if (msg) b.scrollIntoView({ block: 'nearest' });
  }

  function clientValidate(cfg, data) {
    var errs = [];
    cfg.fields.forEach(function (f) {
      var hidden = f.showIf && !data[f.showIf];
      if (f.required && !hidden && String(data[f.key] === undefined ? '' : data[f.key]).trim() === '') errs.push('«' + f.label + '» обязательно');
    });
    if (data.start_date && data.deadline && data.start_date > data.deadline) errs.push('Дата начала позже срока');
    if (data.blocked && !String(data.block_reason || '').trim()) errs.push('Укажите причину блокировки');
    if (cfg.prefix === 'APR' && !S.drawer.id && !collectVoters().length) errs.push('Выберите участников голосования');
    var p = Number(data.progress);
    if (data.progress !== undefined && (!isFinite(p) || p < 0 || p > 100 || Math.floor(p) !== p)) errs.push('Прогресс — целое число от 0 до 100');
    return errs.join('; ');
  }

  function saveEntity() {
    var d = S.drawer; if (!d) return;
    var cfg = S.meta.types[d.type], data = collectForm(cfg);
    var err = clientValidate(cfg, data);
    if (err) { formError(err); return; }
    formError('');
    var btn = $('[data-act="ent-save"]'); if (btn) btn.disabled = true;
    var p;
    if (!d.id) {
      var target = $('#cLinkTarget').value;
      var link = target ? { other_id: target, link_type: $('#cLinkType').value } : null;
      if (d.type === 'approval') data.voters = collectVoters();
      p = authCall('createEntity', d.type, data, link).then(function (res) {
        toast('Создано: ' + res.entity.id);
        return reload().then(function () { openEntity(d.type, res.entity.id); });
      });
    } else {
      var e = S.idx.byId[d.id], changes = {};
      cfg.fields.forEach(function (f) {
        var old = e[f.key] === undefined || e[f.key] === null ? '' : e[f.key];
        if (String(old) !== String(data[f.key])) changes[f.key] = data[f.key];
      });
      var steps = [];
      if (Object.keys(changes).length) steps.push(function () { return authCall('updateEntity', d.id, changes); });
      if (d.type === 'approval') {            // состав голосующих меняется отдельным вызовом
        var cur = (S.idx.votes[d.id] || []).map(function (v) { return v.voter.toLowerCase(); }).sort().join('|');
        var now = collectVoters();
        if (now.map(function (v) { return v.toLowerCase(); }).sort().join('|') !== cur) {
          steps.push(function () { return authCall('setApprovalVoters', d.id, now); });
        }
      }
      if (!steps.length) { toast('Изменений нет'); if (btn) btn.disabled = false; return; }
      p = steps.reduce(function (acc, fn) { return acc.then(fn); }, Promise.resolve()).then(function () {
        toast('Сохранено');
        return reload().then(function () { openEntity(d.type, d.id); });
      });
    }
    p.catch(function (er) { formError(er.message); if (btn) btn.disabled = false; });
  }

  function deleteEntity() {
    var d = S.drawer, e = d && S.idx.byId[d.id]; if (!e) return;
    confirmBox('Удалить «' + e.name + '» (' + e.id + ')? Будут удалены связи и документы объекта. Действие нельзя отменить.', 'Удалить').then(function (ok) {
      if (!ok) return;
      authCall('deleteEntity', e.id).then(function () { closeDrawer(); toast('Удалено'); return reload(); })
        .catch(function (er) { toast(er.message, true); });
    });
  }

  /* ---------- Документы и связи в карточке ---------- */
  function addDoc() {
    var name = $('#docName').value, url = $('#docUrl').value;
    authCall('addDocument', S.drawer.id, name, url).then(function () {
      $('#docName').value = ''; $('#docUrl').value = '';
      toast('Документ добавлен'); return reload();
    }).catch(function (er) { toast(er.message, true); });
  }

  function editDoc(docId) {
    var doc = S.data.documents.filter(function (x) { return x.doc_id === docId; })[0]; if (!doc) return;
    openModal('Документ',
      '<label class="field"><span>Название</span><input type="text" id="mdName" maxlength="200" value="' + esc(doc.doc_name) + '"></label>' +
      '<label class="field"><span>Адрес документа</span><input type="url" id="mdUrl" value="' + esc(doc.doc_url) + '"></label><div id="modalErr" class="form-error" hidden></div>', [
        { text: 'Отмена', fn: function () { } },
        {
          text: 'Сохранить', cls: 'primary', fn: function () {
            return authCall('updateDocument', docId, { doc_name: $('#mdName').value, doc_url: $('#mdUrl').value })
              .then(function () { toast('Документ обновлён'); return reload(); });
          }
        }]);
  }

  function delDoc(docId) {
    confirmBox('Удалить ссылку на документ?', 'Удалить').then(function (ok) {
      if (ok) authCall('deleteDocument', docId).then(function () { toast('Документ удалён'); return reload(); }).catch(function (er) { toast(er.message, true); });
    });
  }

  function delLink(linkId) {
    confirmBox('Удалить связь?', 'Удалить').then(function (ok) {
      if (ok) authCall('deleteLink', linkId).then(function () { toast('Связь удалена'); return reload(); }).catch(function (er) { toast(er.message, true); });
    });
  }

  /* ============================================================================
   * МОДАЛЬНОЕ ОКНО
   * ========================================================================== */
  function openModal(title, bodyHtml, buttons) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = bodyHtml;
    S.modalButtons = buttons;
    $('#modalFoot').innerHTML = buttons.map(function (b, i) {
      return '<button class="btn ' + (b.cls || '') + '" data-act="modal-btn" data-i="' + i + '">' + esc(b.text) + '</button>';
    }).join('');
    $('#modalWrap').hidden = false;
    var f = $('#modalBody input, #modalBody select'); if (f) f.focus();
  }
  function closeModal() { $('#modalWrap').hidden = true; S.modalButtons = []; }

  function runModalButton(i) {
    var b = S.modalButtons[i]; if (!b) return;
    var er = $('#modalErr'); if (er) er.hidden = true;
    var res;
    try { res = b.fn(); } catch (e) { showModalErr(e); return; }
    if (res && typeof res.then === 'function') {
      res.then(function () { closeModal(); }).catch(showModalErr);
    } else closeModal();
  }
  function showModalErr(e) {
    var er = $('#modalErr');
    if (er) { er.hidden = false; er.textContent = e.message; } else toast(e.message, true);
  }

  function confirmBox(text, okText) {
    return new Promise(function (resolve) {
      openModal('Подтверждение', '<p>' + esc(text) + '</p>', [
        { text: 'Отмена', fn: function () { resolve(false); } },
        { text: okText || 'Да', cls: 'primary', fn: function () { resolve(true); } }
      ]);
    });
  }

  /* ============================================================================
   * ОБРАБОТЧИКИ СОБЫТИЙ
   * ========================================================================== */
  var ACT = {
    'tab': function (a) { switchTab(a.getAttribute('data-tab')); },
    'toggle-create': function () { $('#createMenu').hidden = !$('#createMenu').hidden; },
    'new': function (a) { $('#createMenu').hidden = true; openEntity(a.getAttribute('data-type'), null, {}); },
    'new-meeting-day': function (a) { openEntity('meeting', null, { meeting_date: a.getAttribute('data-date') }); },
    'open': function (a, ev) {
      ev.preventDefault();
      var e = S.idx.byId[a.getAttribute('data-id')];
      if (e) openEntity(e._type, e.id);
    },
    'close-drawer': function () { closeDrawer(); },
    'logout': logout,
    'ent-save': saveEntity,
    'ent-delete': deleteEntity,
    'doc-add': addDoc,
    'doc-edit': function (a) { editDoc(a.getAttribute('data-id')); },
    'doc-del': function (a) { delDoc(a.getAttribute('data-id')); },
    'link-new': function () { openLinkModal(null, ''); },
    'link-edit': function (a) { openLinkModal(a.getAttribute('data-id')); },
    'link-del': function (a) { delLink(a.getAttribute('data-id')); },
    'ent-link-add': function () { openLinkModal(null, S.drawer.id); },
    'cal-nav': function (a) { calNav(Number(a.getAttribute('data-d'))); },
    'cal-today': function () { S.cal.cursor = today(); renderMeetings(); },
    'cal-mode': function (a) { S.cal.mode = a.getAttribute('data-m'); renderMeetings(); },
    'g-today': function () { if (S.gantt.scrollToday) S.gantt.scrollToday(); },
    'g-fit': function () {            // уместить весь проект по ширине окна
      var sc = $('#gScroll'); if (!sc || !S.gantt.days) return;
      S.gantt.dw = Math.max(DW_MIN, Math.min(DW_MAX, (sc.clientWidth - S.gantt.LW - 12) / S.gantt.days));
      $('#gZoom').value = sliderFromDw(S.gantt.dw); syncRanges();
      drawGantt({}); sc = $('#gScroll'); sc.scrollLeft = 0;
    },
    'g-col-expand': function () {
      if (S.gantt.lw) { setLW(lwDefault(), true); }        // already custom: back to the default width
      else { setLW(fitLW(), true); }                       // expand to fit the longest name
    },
    'g-toggle': function (a, ev) {
      ev.preventDefault();
      var id = a.getAttribute('data-id'), sc = $('#gScroll');
      S.gantt.collapsed[id] = !S.gantt.collapsed[id];
      drawGantt({ scroll: sc ? { l: sc.scrollLeft, t: sc.scrollTop } : null });
    },
    'g-all': function (a) {
      var open = a.getAttribute('data-open') === '1', sc = $('#gScroll');
      S.gantt.collapsed = {};
      if (!open) [].concat(S.data.entities.stage, S.data.entities.task, S.data.entities.subtask).forEach(function (e) { if (ganttHasKids(e)) S.gantt.collapsed[e.id] = true; });
      drawGantt({ scroll: sc ? { l: sc.scrollLeft, t: sc.scrollTop } : null });
    },
    'g-reset': function () {
      S.gantt.dw = DW_DEFAULT; $('#gZoom').value = sliderFromDw(DW_DEFAULT); syncRanges();
      drawGantt({});
    },
    'kb-filter': function (a) { S.kb.type = a.getAttribute('data-t'); renderKanban(); },
    'reg-toggle': function (a) {
      var id = a.getAttribute('data-id'); S.regOpen[id] = !S.regOpen[id];
      $('#regBlock').innerHTML = registerHTML();
    },
    'info-refresh': function () { S.info = null; S.infoErr = ''; var b = $('#infoBlock'); if (b) b.innerHTML = infoBlockHTML(); loadInfo(true); },
    'tbl-toggle': function (a, ev) {
      ev.preventDefault();
      var key = a.getAttribute('data-id'); S.tbl.collapsed[key] = !S.tbl.collapsed[key]; drawTable();
    },
    'tbl-expand': function () { S.tbl.collapsed = {}; drawTable(); },
    'tbl-collapse': function () {
      S.tbl.collapsed = {};
      (S.tbl.rows || []).forEach(function (r) { if (r.has_children) S.tbl.collapsed[r.key] = true; });
      drawTable();
    },
    'voter-add': addVoterFromInput,
    'vote-cast': castVote,
    'log-apply': function () {
      S.logFilter = { entity_type: $('#lgType').value, date_from: $('#lgFrom').value, date_to: $('#lgTo').value, entity_id: $('#lgId').value.trim().toUpperCase() };
      renderLog();
    },
    'log-reset': function () { S.logFilter = { entity_type: '', date_from: '', date_to: '', entity_id: '' }; renderLog(); },
    'modal-close': closeModal,
    'modal-btn': function (a) { runModalButton(Number(a.getAttribute('data-i'))); }
  };

  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('[data-act]');
    if (!a) {
      if (!ev.target.closest('.menu-wrap')) $('#createMenu').hidden = true;
      return;
    }
    var h = ACT[a.getAttribute('data-act')];
    if (h) h(a, ev);
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target, id = t.id;
    if (id === 'f_blocked') syncShowIf();
    else if (id === 'f_status' && t.value === 'Done' && $('#f_progress')) { $('#f_progress').value = 100; $('#f_progress_r').value = 100; syncProgress(); }
    else if (id === 'cLinkType') fillLinkTargets(S.drawer.type);
    else if (id === 'parentSel') {
      authCall('setParent', S.drawer.id, t.value).then(function () { toast('Родитель изменён'); return reload(); })
        .catch(function (er) { toast(er.message, true); return reload(); });
    } else if (id === 'exF') { S.exch.filter = t.value; drawExchangeCards(); }
    else if (id === 'gBlock') {
      S.gantt.blockOnly = t.checked;
      drawGantt({ recenter: true });
    } else if (id === 'gDeps') {
      S.gantt.deps = t.checked; lsSet('ec2_gantt_deps', t.checked ? '1' : '0');   // survives re-renders and reloads
      drawGantt({ recenter: true });
    }
  });

  document.addEventListener('input', function (ev) {
    var id = ev.target.id;
    if (ev.target.type === 'range') rangeFill(ev.target);
    if (id === 'f_progress_r') { $('#f_progress').value = ev.target.value; syncProgress(); }
    else if (id === 'f_progress') { $('#f_progress_r').value = ev.target.value; syncProgress(); }
    else if (id === 'exQ') { S.exch.q = ev.target.value; drawExchangeCards(); }
    else if (id === 'tblQ') { S.tbl.q = ev.target.value; drawTable(); }
    else if (id === 'gZoom') onZoomInput(ev.target.value);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (!$('#modalWrap').hidden) closeModal();
      else if (S.drawer) closeDrawer();
    } else if (ev.key === 'Enter' && ev.target.id === 'docUrl') { ev.preventDefault(); addDoc(); }
    else if (ev.key === 'Enter' && ev.target.id === 'voterNew') { ev.preventDefault(); addVoterFromInput(); }
    else if (ev.key === 'Enter' && !$('#modalWrap').hidden && ev.target.tagName === 'INPUT') {
      ev.preventDefault(); var last = S.modalButtons.length - 1; if (last >= 0) runModalButton(last);
    }
  });

  /* Gantt: column resizer */
  document.addEventListener('pointerdown', resizeStart);
  document.addEventListener('pointermove', resizeMove);
  document.addEventListener('pointerup', resizeEnd);
  document.addEventListener('pointercancel', resizeEnd);
  document.addEventListener('keydown', function (ev) {
    if (ev.target.id !== 'gResizer' || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
    ev.preventDefault();
    setLW((S.gantt.LW || curLW()) + (ev.key === 'ArrowRight' ? 16 : -16), true);
  });

  /* Канбан: перетаскивание карточек (pointer-события работают и мышью, и касанием) */
  document.addEventListener('pointerdown', dragStart);
  document.addEventListener('pointermove', dragMove, { passive: false });
  document.addEventListener('pointerup', function (ev) { dragEnd(ev, false); });
  document.addEventListener('pointercancel', function (ev) { dragEnd(ev, true); });
  document.addEventListener('click', function (ev) {                 // сразу после перетаскивания клик не открывает карточку
    if (S.noClick) { ev.stopPropagation(); ev.preventDefault(); }
  }, true);

  /* Гант: подсказка коннектора и подсветка цепочки зависимостей при наведении */
  document.addEventListener('mouseover', function (ev) {
    if (S.tab !== 'gantt' || !ev.target.closest) return;
    var conn = ev.target.closest('.g-conn');
    if (conn) {
      showConnTip(conn, ev);
      var l = S.data.links.filter(function (x) { return x.link_id === conn.getAttribute('data-lid'); })[0];
      if (l) applyChain([l.source_id, l.target_id]);
      return;
    }
    var n = ev.target.closest('.g-node');
    if (n) applyChain([n.getAttribute('data-id')]);
  });
  document.addEventListener('mousemove', function (ev) { if (S.tab === 'gantt') moveTip(ev); });
  document.addEventListener('mouseout', function (ev) {
    if (S.tab !== 'gantt') return;
    var to = ev.relatedTarget;
    if (to && to.closest && (to.closest('.g-conn') || to.closest('.g-node'))) return;
    var tip = $('#gTip'); if (tip) tip.hidden = true;
    applyChain(S.gantt.sel ? [S.gantt.sel] : null);
  });

  window.addEventListener('resize', function () { if (S.tab === 'gantt' && S.data) renderGantt(true); });

  /* ---------- Запуск ---------- */
  $('#loginForm').addEventListener('submit', onLogin);
  var saved = load('ec2_token');
  if (saved) {
    S.token = saved;
    loadAll().catch(function () { showLogin(''); });
  } else {
    showLogin('');
  }
})();
</script>

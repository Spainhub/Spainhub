<style>
/* ==========================================================================
   E-commerce 2.0 — стили.
   Минимализм, один акцентный цвет, скругления 12–16px, единая шкала отступов.
   Вёрстка тянется на всю ширину окна (от 1280px до ультрашироких экранов).
   ========================================================================== */
:root {
  --row-h: 52px;   /* Gantt row height; keep in sync with ROW_H in the script */
  /* Палитра */
  --bg: #efefef;                 /* general page background */
  --header: #ffffff;             /* header background */
  --surface: #ffffff;            /* blocks */
  --ink: #1f2430;
  --muted: #6b7280;
  --line: #e4e4e4;
  --line-2: #efefef;
  /* Orange: buttons, sliders, progress bars */
  --accent: #ff7f57;
  --accent-hover: #f2683c;
  --accent-dark: #d9552b;
  --accent-soft: #ffece6;
  --accent-mid: #ffd2c2;
  /* Purple: links, active tab, text buttons, stage */
  --purple: #7b61a5;
  --link: #7b61a5;
  /* Status colors (badges, Gantt) */
  --st-stage: #7b61a5;    --st-stage-track: #ddd5ea;
  --st-planned: #efefef;  --st-planned-track: #efefef;
  --st-prog: #12a238;     --st-prog-track: #cfe9d6;
  --st-done: #25da55;     --st-done-track: #c8f5d5;
  --st-over: #e06666;     --st-over-track: #f6d5d5;
  --st-block: #cc4b4b;    --st-block-track: #f0c4c4;   /* slightly deeper than overdue, still soft */
  --st-decision: #ff7f57;
  --st-approved: #25da55;
  --st-rejected: #e06666;
  --danger: #e06666;  --danger-soft: #fbeaea;  --danger-ink: #b94141;   /* ink: red text on white stays readable */
  --ok: #12a238;  --ok-soft: #e4f3ea;
  --warn: #d9552b;  --warn-soft: #ffece6;

  /* Шкала отступов */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  /* Адаптивные величины: плавно растут от 1280px до 2560px */
  --page-pad: clamp(16px, 1.6vw + 4px, 48px);
  --gap: clamp(12px, .8vw + 6px, 28px);
  --card-pad: clamp(16px, .5vw + 10px, 28px);

  /* Типографическая шкала */
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --fs-2xl: 24px;

  /* Скругления, границы, тени */
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --bw: 1px;
  --border: var(--bw) solid var(--line);
  --shadow: 0 1px 2px rgba(20, 28, 48, .05), 0 4px 14px rgba(20, 28, 48, .06);   /* light shadow under blocks */
  --shadow-lg: 0 10px 40px rgba(20, 28, 48, .18);
  --ring: 0 0 0 3px rgba(255, 127, 87, .35);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; overflow-y: scroll; }   /* constant width: header never shifts between tabs */
html, body { margin: 0; padding: 0; width: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(14px, .3vw + 10px, 16px);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
p { margin: 0 0 var(--s-2); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-xs); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }

/* Видимое фокусное кольцо для клавиатурной навигации */
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--accent); }

/* ---------- Кнопки и поля ---------- */
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
.btn {
  border: var(--border); background: var(--surface); color: var(--ink);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-md); font-weight: 500; line-height: 1.3;
  transition: background .15s, border-color .15s, box-shadow .15s, transform .08s;
}
.btn:hover { background: #fff1ec; border-color: #ffbfa9; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger-ink); border-color: #efc7c2; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { padding: var(--s-1) var(--s-3); font-size: var(--fs-xs); border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
.link-btn { border: 0; background: none; color: var(--link); padding: 0; font-weight: 500; }
/* text buttons: black text on purple (Refresh, Full log, Open, Log out) */
.link-btn.pbtn { background: var(--purple); color: #fff; padding: 4px 12px; border-radius: 10px; font-weight: 600; text-decoration: none; transition: filter .15s; }
.link-btn.pbtn:hover { filter: brightness(1.08); text-decoration: none; }
/* Log out: plain text button, no fill */
.link-btn.logout { color: var(--ink); font-weight: 500; padding: 4px 6px; }
.link-btn.logout:hover { color: var(--purple); text-decoration: underline; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--danger-ink); }
.icon-btn {
  border: 0; background: none; font-size: 24px; line-height: 1; width: 34px; height: 34px;
  border-radius: 10px; color: var(--muted); transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--line-2); color: var(--ink); }

input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], input[type=url],
select, textarea {
  width: 100%; font-family: inherit; font-size: var(--fs-md); color: var(--ink); line-height: 1.4;
  background: #fff; border: var(--bw) solid #dcdfe6; border-radius: 10px; padding: var(--s-2) var(--s-3);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: #c7ccd6; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); }
input:disabled, select:disabled, textarea:disabled { background: #f6f7f9; color: var(--muted); cursor: not-allowed; }
textarea { resize: vertical; min-height: 72px; }
input[type=range] { width: 100%; accent-color: var(--accent); padding: 0; border: 0; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; }

.field { display: flex; flex-direction: column; gap: var(--s-1); margin-bottom: var(--s-3); min-width: 0; }
.field > span, .field > label { font-size: var(--fs-xs); font-weight: 500; color: var(--muted); }
.field .req { color: var(--danger-ink); }
.check-row { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-md) !important; color: var(--ink) !important; font-weight: 500; cursor: pointer; }
.form-error {
  background: var(--danger-soft); color: var(--danger-ink); border-radius: 10px;
  padding: var(--s-2) var(--s-3); margin: var(--s-2) 0; font-size: var(--fs-sm);
}
.hint { font-size: var(--fs-xs); color: var(--muted); }

/* ---------- Document names: wrap inside their block, never overflow ---------- */
.doc-title, .doc-ref { display: block; min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
.doc-ref { margin-bottom: var(--s-2); }
.doc-ref:last-child { margin-bottom: 0; }
.doc-title { font-weight: 500; color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.hist-item, .xc-extra p, .vote-row .cmt { overflow-wrap: anywhere; word-break: break-word; }

/* ---------- Состояния загрузки и пустые состояния ---------- */
.busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; overflow: hidden; }
.busy::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--accent); animation: busy 1s ease-in-out infinite; border-radius: 3px; }
@keyframes busy { 0% { left: -35%; } 100% { left: 100%; } }
.loading { display: flex; align-items: center; justify-content: center; gap: var(--s-3); padding: var(--s-6) var(--s-4); color: var(--muted); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent-mid); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { color: var(--muted); padding: var(--s-5) var(--s-4); text-align: center; font-size: var(--fs-sm); }
.empty b { display: block; color: var(--ink); font-size: var(--fs-md); margin-bottom: var(--s-1); font-weight: 600; }

/* ---------- Экран входа ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--s-4); }
.login-card { width: 100%; max-width: 400px; background: var(--surface); border: 0; border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: var(--s-6); }
.login-card .brand { margin-bottom: var(--s-2); }

/* ---------- Каркас на всю ширину ---------- */
.app { min-height: 100vh; width: 100%; display: flex; flex-direction: column; }
.topbar {
  min-height: 68px;
  position: sticky; top: 0; z-index: 20; width: 100%; display: flex; align-items: center; gap: var(--s-5);
  background: var(--header);
  border-bottom: var(--border); padding: var(--s-3) var(--page-pad);
}
.brand { flex: none; font-weight: 700; font-size: clamp(22px, .5vw + 16px, 30px); line-height: 1.1; letter-spacing: -.03em; white-space: nowrap; color: var(--ink); }
.brand-lg { font-size: 30px; }

.tabs { display: flex; gap: var(--s-1); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: var(--s-1) 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: var(--s-2) var(--s-4); border-radius: 10px; color: var(--muted);
  font-weight: 500; white-space: nowrap; transition: color .15s, background .15s;
}
.tab:hover { color: var(--ink); background: var(--line-2); }
.tab.active { color: #fff; background: var(--purple); }

.top-actions { display: flex; align-items: center; gap: var(--s-4); }
.user { display: flex; align-items: center; gap: var(--s-3); color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 200px; background: var(--surface);
  border: var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: var(--s-1); z-index: 30;
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); }
.menu button:hover { background: var(--accent-soft); color: var(--ink); }

.content { flex: 1; width: 100%; min-width: 0; padding: var(--s-5) var(--page-pad); }
.view { display: none; width: 100%; min-width: 0; }
.view.active { display: block; animation: viewIn .28s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.footer { width: 100%; text-align: center; color: var(--muted); font-size: var(--fs-xs); padding: var(--s-4) var(--page-pad) var(--s-5); border-top: var(--border); background: var(--surface); }

.view-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-4); flex-wrap: wrap; }
.view-head h2 { font-size: var(--fs-2xl); }
.view-lead { color: var(--muted); margin-bottom: var(--s-4); }
.toolbar { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.toolbar select, .toolbar input[type=text], .toolbar input[type=date] { width: auto; min-width: 140px; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: var(--s-1) var(--s-3); border-radius: var(--r-sm); font-weight: 500; color: var(--muted); transition: background .15s, color .15s; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), inset 0 -2px 0 var(--accent); }

/* ---------- Карточки и сетка ---------- */
.card { background: var(--surface); border: 0; border-radius: var(--r-lg); box-shadow: var(--shadow); padding: var(--card-pad); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-3); gap: var(--s-2); }
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(12, minmax(0, 1fr)); width: 100%; }
.span-4 { grid-column: span 4; }
.span-6 { grid-column: span 6; }
.span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }

.big-num { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.big-num small { font-size: var(--fs-xl); color: var(--muted); font-weight: 500; }
.bar { height: 8px; background: #f1f1f1; border-radius: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .35s var(--ease); }
.bar.ok > i { background: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); margin-top: var(--s-4); }
.kpi { background: var(--bg); border-radius: var(--r-md); padding: var(--s-3); }
.kpi b { display: block; font-size: var(--fs-xl); letter-spacing: -.02em; }
.kpi span { font-size: var(--fs-xs); color: var(--muted); }
.kpi.bad b { color: var(--danger-ink); }

.stat-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 28px; align-items: center; gap: var(--s-3); padding: 6px 0; }
.stat-row .bar { height: 6px; }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-2); border-radius: 10px; cursor: pointer; transition: background .15s; }
.list-item + .list-item { border-top: var(--bw) solid var(--line-2); }
.list-item:hover { background: var(--bg); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.date-chip { font-size: var(--fs-xs); font-weight: 600; min-width: 76px; }
.date-chip.late { color: var(--danger-ink); }

/* ---------- Метки и статусы ---------- */
.pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: var(--fs-xs); font-weight: 500; background: var(--line-2); color: var(--muted); white-space: nowrap; line-height: 1.5; }
/* Badge text: white on solid saturated fills, black on light / semi-transparent fills */
.s-NotStarted, .s-Cancelled, .s-Planned { background: var(--st-planned); color: #000; box-shadow: inset 0 0 0 1px #dcdcdc; }
.s-InProgress { background: var(--st-prog); color: #fff; }
.s-UnderReview { background: rgba(255, 127, 87, .38); color: #000; }
.s-Pending { background: var(--st-decision); color: #fff; }
.s-Done, .s-Approved, .s-Held { background: rgba(37, 218, 85, .32); color: #000; }   /* bright green: tinted so the text stays legible */
.s-Blocked { background: var(--st-block); color: #fff; }
.s-Rejected, .s-late { background: var(--st-over); color: #fff; }
/* Голоса участников */
.v-Agree { background: rgba(37, 218, 85, .32); color: #000; }
.v-Discussed { background: rgba(255, 127, 87, .38); color: #000; }
.v-NoDecision { background: var(--st-planned); color: #000; box-shadow: inset 0 0 0 1px #dcdcdc; }
.v-Disagree { background: var(--st-rejected); color: #fff; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--st-planned); color: #000; text-transform: uppercase; letter-spacing: .03em; line-height: 1.6; }
.tag.t-stage { background: var(--st-stage); color: #fff; }
.tag.t-task { background: rgba(255, 127, 87, .28); color: #000; }
.tag.t-subtask { background: rgba(255, 127, 87, .14); color: #000; }
.tag.t-meeting { background: var(--st-planned); color: #000; box-shadow: inset 0 0 0 1px #dcdcdc; }
.tag.t-approval { background: var(--st-decision); color: #fff; }
.tag.t-project, .tag.t-system { background: var(--st-planned); color: #000; }

/* ---------- Таблицы ---------- */
.table-card { padding: 0; overflow: hidden; }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: var(--s-3) var(--s-4); background: #fafbfc; border-bottom: var(--border); white-space: nowrap; }
.tbl td { padding: var(--s-3) var(--s-4); border-bottom: var(--bw) solid var(--line-2); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: #fafbfd; }
.log-old { color: var(--muted); text-decoration: line-through; text-decoration-color: #c5c9d1; }

/* Реестр согласований */
.reg-row { cursor: pointer; }
.reg-row td { font-weight: 500; }
.reg-caret { display: inline-block; width: 10px; transition: transform .2s var(--ease); color: var(--muted); }
.reg-row.open .reg-caret { transform: rotate(90deg); }
.reg-sub td { background: #fafbfd; font-weight: 400; padding-top: var(--s-2); padding-bottom: var(--s-2); }
.reg-sub:hover td { background: #fafbfd !important; }
.reg-sub td:first-child { padding-left: var(--s-6); }

/* ---------- Project files: the source layout; every cell keeps its own column ---------- */
.info-wrap { overflow-x: auto; }
.info-grid { display: grid; grid-auto-rows: minmax(1.9em, auto); column-gap: var(--s-5); row-gap: 2px; align-items: start; min-width: 0; }
.info-cell { min-width: 0; overflow-wrap: anywhere; line-height: 1.5; padding: 1px 0; }
.info-text { color: var(--ink); }
.info-link { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; font-weight: 500; }
.info-link:hover { filter: brightness(.85); text-decoration-thickness: 2px; }

/* ---------- Calendar (compact, thin outline, even margins) ---------- */
.cal { padding: var(--s-3); overflow: hidden; background: var(--surface); border: 0; border-radius: var(--r-lg); box-shadow: var(--shadow); }
.cal-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding-bottom: var(--s-1); }
.cal-head div { padding: var(--s-1) var(--s-2); font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: var(--border); border-radius: var(--r-md); overflow: hidden; }
.cal-day { min-height: clamp(46px, 4vw, 60px); border-right: var(--bw) solid var(--line-2); border-bottom: var(--bw) solid var(--line-2); padding: var(--s-1) 6px; cursor: pointer; transition: background .15s; min-width: 0; }
.cal-day:nth-last-child(-n+7) { border-bottom: 0; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day:hover { background: #fafbfd; }
.cal-day.other { background: #fafbfc; color: #a0a6b2; }
.cal-day .num { font-size: 11px; font-weight: 600; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 2px; }
.cal-day.today .num { background: var(--accent); color: #fff; }
.cal-week .cal-day { min-height: 150px; }
.ev { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 2px 6px; margin-bottom: 2px; background: rgba(255, 127, 87, .28); color: #000; font-size: 11px; line-height: 1.35; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background .15s; }
.ev:hover { background: rgba(255, 127, 87, .45); }
.ev .t { font-weight: 700; margin-right: 4px; }
.ev.s-Held { background: rgba(37, 218, 85, .32); color: #000; }
.ev.s-Cancelled { background: var(--st-planned); color: #555; text-decoration: line-through; }
.cal-week .ev { white-space: normal; padding: 4px 6px; }

/* ---------- Table tab: hierarchical tree ---------- */
.tbl-tree { table-layout: fixed; min-width: 1280px; }
.tbl-tree th, .tbl-tree td { padding-left: var(--s-3); padding-right: var(--s-3); }
.tbl-tree th { white-space: normal; }
.tbl-tree { font-size: var(--fs-sm); }
.tbl-tree td { overflow-wrap: break-word; }   /* break words only when they cannot fit; URLs use .url (anywhere) */
.tbl-tree tr.lv-stage td { background: #f4f0fa; font-weight: 600; }
.tbl-tree tr.lv-meeting td { background: #fffdfb; }
.tbl-tree td.cm { font-size: var(--fs-lg); line-height: 1.5; color: var(--ink); white-space: pre-wrap; }   /* large comments / protocol */
.tn .no { flex: none; font-variant-numeric: tabular-nums; font-weight: 700; color: #000; min-width: 2.2em; }
.tbl-tree tr.lv-stage:hover td { background: #ebe4f5; }
.tn { display: flex; align-items: flex-start; gap: var(--s-2); min-width: 0; flex-wrap: wrap; }
.tn a { color: inherit; font-weight: 500; min-width: 5em; flex: 1 1 6em; }   /* wraps below the number instead of being squeezed to one letter per line */
.pill-wrap { white-space: normal; border-radius: 10px; text-align: center; padding: 2px 8px; font-size: 11px; }
.tn a:hover { color: var(--link); }
.tg, .tg-sp { flex: none; width: 22px; height: 22px; border-radius: 6px; }
.tg { position: relative; border: var(--border); background: var(--surface); transition: background .15s, border-color .15s; padding: 0; }
.tg:hover { background: var(--accent-soft); border-color: var(--accent); }
.tg-ico::before, .tg-ico::after { content: ''; position: absolute; left: 50%; top: 50%; background: var(--accent-dark); border-radius: 1px; transform: translate(-50%, -50%); transition: transform .2s var(--ease), opacity .2s; }
.tg-ico::before { width: 10px; height: 2px; }
.tg-ico::after { width: 2px; height: 10px; }
.tg.open .tg-ico::after { transform: translate(-50%, -50%) rotate(90deg); opacity: 0; }   /* plus becomes minus */
.tg-cell { text-align: center; vertical-align: top; }
.tg-cell .tg { margin: 0 auto; }
.tp { display: flex; align-items: center; gap: var(--s-2); }
.tp .bar { flex: 1; min-width: 36px; height: 6px; }
.tp b { font-size: var(--fs-xs); min-width: 34px; text-align: right; }
.tm { margin-bottom: var(--s-1); }

/* ---------- Канбан ---------- */
.kb { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); align-items: start; width: 100%; }
.kb-col { background: var(--surface); border-radius: var(--r-lg); display: flex; flex-direction: column; min-width: 0; border: 0; box-shadow: var(--shadow); transition: border-color .15s, background .15s, box-shadow .15s; }
.kb-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); padding: var(--s-3) var(--s-4); }
.kb-head h3 { font-size: var(--fs-md); display: flex; align-items: center; gap: var(--s-2); }
.kb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-prog); }
.kb-col[data-col=planned] .kb-dot { background: var(--st-planned); box-shadow: inset 0 0 0 1px #b8b8b8; }
.kb-col[data-col=done] .kb-dot { background: var(--st-done); }
.kb-col[data-col=awaiting] .kb-dot { background: var(--st-over); }
.kb-split { padding: 0 var(--s-4) var(--s-2); font-size: 11px; color: var(--muted); min-height: 1.4em; }
.k-type { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-2); }
.k-card.t-stage { box-shadow: inset 0 3px 0 var(--st-stage), 0 1px 3px rgba(20, 28, 48, .1); }
.k-card.t-stage .k-title { font-weight: 700; }
.k-card.t-subtask { box-shadow: inset 0 3px 0 #b9a9d3, 0 1px 3px rgba(20, 28, 48, .1); }
.kb-count { background: var(--bg); border-radius: 20px; padding: 1px 10px; font-size: var(--fs-xs); font-weight: 600; color: #000; }
.kb-body { padding: 0 var(--s-3) var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); overflow-y: auto; max-height: calc(100vh - 250px); min-height: 140px; }
.kb-col.k-over { border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--ring); }
.kb-col.k-deny { background: var(--danger-soft); box-shadow: 0 0 0 2px var(--st-over); }
.kb-empty { color: var(--muted); font-size: var(--fs-sm); text-align: center; padding: var(--s-5) var(--s-2); border: var(--bw) dashed #cdd2db; border-radius: var(--r-md); }
.k-card { position: relative; background: var(--surface); border-radius: var(--r-md); padding: var(--s-3) var(--s-3) var(--s-3) var(--s-5); border: 0; border-left: 3px solid transparent;   /* no outline; the left stripe only marks blocked / overdue */
   box-shadow: 0 1px 3px rgba(20, 28, 48, .1); cursor: grab; user-select: none; -webkit-user-select: none; transition: box-shadow .15s, transform .15s var(--ease), opacity .15s; border-left: 3px solid transparent; }
.k-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.k-card.blocked { border-left-color: var(--st-block); }
.k-card.late { border-left-color: var(--st-over); }
.k-card.k-dragging { opacity: .35; }
.k-grip { position: absolute; left: 6px; top: 0; bottom: 0; width: 14px; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
.k-grip::before { content: ''; width: 6px; height: 14px; background: radial-gradient(circle, #b4bac6 1.2px, transparent 1.4px) 0 0 / 6px 5px; }
.k-title { font-weight: 600; margin-bottom: var(--s-2); overflow-wrap: anywhere; }
.k-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); font-size: var(--fs-xs); color: var(--muted); margin-bottom: var(--s-2); }
.k-meta .late { color: var(--danger-ink); font-weight: 600; }
.k-prog { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-xs); color: var(--muted); }
.k-prog .bar { flex: 1; height: 6px; }
.k-flags { margin-top: var(--s-2); display: flex; gap: var(--s-1); flex-wrap: wrap; }
.k-flash { animation: kflash .9s var(--ease); }
@keyframes kflash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 1px 2px rgba(20, 28, 48, .08); } }
.k-ghost { position: fixed; z-index: 120; pointer-events: none; width: 280px; transform: rotate(2deg); box-shadow: var(--shadow-lg); opacity: .96; }

/* ---------- Обмен: карточки ---------- */
.xc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(300px, 22vw, 440px), 1fr)); gap: var(--gap); }
.xc { display: flex; flex-direction: column; padding: 0; overflow: hidden; transition: box-shadow .15s, transform .15s var(--ease); }
.xc:hover { box-shadow: 0 2px 6px rgba(20, 28, 48, .08), 0 12px 28px rgba(20, 28, 48, .1); transform: translateY(-1px); }
.xc-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); padding: var(--s-3) var(--s-4); background: #fafbfc; border-bottom: var(--border); }
.xc-type { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.xc-block { padding: var(--s-3) var(--s-4); cursor: pointer; transition: background .15s; }
.xc-block + .xc-block { border-top: var(--bw) solid var(--line-2); }
.xc-block:hover { background: #fafbfd; }
.xc-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--s-1); }
.xc-who { font-size: var(--fs-lg); font-weight: 600; margin-bottom: 2px; }
.xc-task { font-size: var(--fs-sm); color: var(--ink); }
.xc-task-label { color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; }
.xc-extra { cursor: default; }
.xc-extra:hover { background: transparent; }
.xc-extra p { margin: 0 0 var(--s-1); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.xc-foot > div { min-width: 0; overflow-wrap: anywhere; }
.xc-foot .pill { flex: none; }
.xc-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); padding: var(--s-3) var(--s-4); border-top: var(--border); margin-top: auto; font-size: var(--fs-sm); }

/* ---------- Диаграмма Ганта ---------- */
.g-bar-top { display: flex; align-items: center; gap: var(--s-4) var(--s-5); flex-wrap: wrap; margin-bottom: var(--s-3); }
.zoom-ctl { display: flex; align-items: center; gap: var(--s-3); flex: 1; min-width: 280px; max-width: 560px; }
.zoom-ctl .zl { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
.zoom-ctl input[type=range] { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: var(--s-2); cursor: pointer; font-weight: 500; user-select: none; }
.toggle .sw { width: 36px; height: 20px; border-radius: 20px; background: #cdd2db; position: relative; transition: background .2s; flex: none; }
.toggle .sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .2s var(--ease); }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle input:checked + .sw { background: var(--accent); }
.toggle input:checked + .sw::after { transform: translateX(16px); }
.toggle input:focus-visible + .sw { box-shadow: var(--ring); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5); font-size: var(--fs-xs); color: var(--muted); margin-bottom: var(--s-3); align-items: center; }
.legend .it { display: inline-flex; align-items: center; gap: 7px; }
.lg-bar { width: 26px; height: 10px; border-radius: 5px; background: var(--st-prog-track); position: relative; overflow: hidden; display: inline-block; }
.lg-bar::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 55%; background: var(--st-prog); }
.lg-bar.stage { background: var(--st-stage-track); } .lg-bar.stage::after { background: var(--st-stage); }
.lg-bar.planned { background: var(--st-planned); box-shadow: inset 0 0 0 1px #d0d0d0; } .lg-bar.planned::after { display: none; }
.lg-bar.done { background: var(--st-done-track); } .lg-bar.done::after { width: 100%; background: var(--st-done); }
.lg-bar.overdue { background: var(--st-over-track); } .lg-bar.overdue::after { background: var(--st-over); }
.lg-bar.blocked { background: var(--st-block-track); } .lg-bar.blocked::after { background: var(--st-block); }
.lg-bar.blocked::before { content: ''; position: absolute; inset: 0; z-index: 2; background: repeating-linear-gradient(45deg, rgba(31, 36, 48, .35) 0 3px, transparent 3px 6px); }
.lg-dia { width: 11px; height: 11px; transform: rotate(45deg); background: var(--st-decision); border-radius: 2px; display: inline-block; }
.lg-dia.ok { background: var(--st-approved); } .lg-dia.bad { background: var(--st-rejected); }
.lg-line { width: 30px; height: 0; display: inline-block; border-top: 2px solid; }
.lg-line.blocks { border-color: #475569; }
.lg-line.handoff { border-color: var(--accent); border-top-style: dashed; }
.lg-line.approval { border-color: var(--purple); border-top-style: dotted; border-top-width: 3px; }
.lg-line.related { border-color: #9aa1ad; border-top-style: dashed; border-top-width: 1px; }
.lg-today { width: 0; height: 14px; border-left: 2px solid var(--st-over); display: inline-block; }

.g-card { padding: 0; overflow: hidden; position: relative; }
.g-scroll { overflow: auto; max-height: calc(100vh - 330px); min-height: 360px; position: relative; }
.g-canvas { position: relative; }
.g-head { position: sticky; top: 0; z-index: 8; display: flex; background: #fafbfc; border-bottom: var(--border); }
.g-corner { position: sticky; left: 0; z-index: 9; flex: none; width: var(--lw, 320px); background: #fafbfc; border-right: var(--border); padding: 0 var(--s-4) var(--s-2); display: flex; align-items: flex-end; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.g-timehead { flex: none; width: var(--tw); }
.g-resizer { position: absolute; top: 0; bottom: 0; right: -5px; width: 10px; cursor: col-resize; z-index: 12; touch-action: none; }
.g-resizer::after { content: ''; position: absolute; top: 20%; bottom: 20%; left: 4px; width: 2px; border-radius: 2px; background: #cdd2db; transition: background .15s, top .15s, bottom .15s; }
.g-resizer:hover::after, .g-resizer:focus-visible::after { background: var(--accent); top: 0; bottom: 0; }
.g-months { display: flex; height: 28px; border-bottom: var(--bw) solid var(--line-2); }
.g-months div { padding: 6px var(--s-2); font-size: var(--fs-xs); font-weight: 600; border-right: var(--bw) solid var(--line-2); overflow: hidden; white-space: nowrap; }
.g-days { display: flex; height: 26px; }
.g-days div { font-size: 11px; color: var(--muted); text-align: center; padding-top: 5px; flex: none; overflow: hidden; }
.g-days div.we { background: #f1f3f6; }
.g-body { position: relative; }
.g-row { display: flex; height: var(--row-h); border-bottom: var(--bw) solid var(--line-2); }
.g-row.group { height: 34px; background: #fafbfc; }
.g-row.group .g-label { cursor: default; font-weight: 600; color: var(--muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; align-items: flex-start; }
.g-row.group .g-label:hover { background: #fafbfc; }
.g-label { margin-bottom: -1px; box-shadow: inset 0 -1px 0 var(--line-2); position: sticky; left: 0; z-index: 5; flex: none; width: var(--lw, 320px); background: var(--surface); border-right: var(--border); padding: 0 var(--s-3); display: flex; flex-direction: column; justify-content: center; cursor: pointer; overflow: hidden; transition: background .15s; }
.g-row.group .g-label { background: #fafbfc; justify-content: center; }
.g-label:hover { background: var(--accent-soft); }
.g-label .nm { font-weight: 500; font-size: var(--fs-sm); line-height: 1.25; display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.g-label .nm .tag, .g-label .nm .pill, .g-label .nm .g-num { flex: none; }
.g-label .nm-t { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.g-num { font-variant-numeric: tabular-nums; font-weight: 700; color: #000; min-width: 2.2em; }
.g-label .sub .pill { font-size: 10px; padding: 0 7px; margin-right: 4px; vertical-align: 1px; }
.g-label .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-label.d-stage .nm { font-weight: 700; }
.g-track { position: relative; flex: none; }
.g-bar { position: absolute; top: 17px; height: 18px; border-radius: 9px; background: var(--st-prog-track); overflow: hidden; cursor: pointer; transition: box-shadow .15s, opacity .2s; min-width: 3px; }
.g-bar:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
.g-bar .g-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--st-prog); }
.g-bar .g-pct { position: absolute; z-index: 3; left: var(--s-2); top: 0; line-height: 18px; font-size: 11px; font-weight: 600; color: #000; }   /* on the light track */
.g-bar .g-pct.on-fill { color: #fff; }                     /* solid fills: in progress, stage, overdue, blocked */
.g-bar.done .g-pct.on-fill { color: #000; }                /* bright green fill stays black */
.g-bar.t-stage { top: 14px; height: 24px; border-radius: 6px; background: var(--st-stage-track); }
.g-bar.t-stage .g-fill { background: var(--st-stage); }
.g-bar.t-stage .g-pct { line-height: 24px; }
.g-bar.t-subtask { top: 19px; height: 14px; }
.g-bar.t-subtask .g-fill { background: #3fbf63; }
.g-bar.t-subtask .g-pct { display: none; }
.g-bar.planned { background: var(--st-planned); box-shadow: inset 0 0 0 1px #d0d0d0; }
.g-bar.done { background: var(--st-done-track); }
.g-bar.done .g-fill { background: var(--st-done); }
.g-bar.overdue { background: var(--st-over-track); }
.g-bar.blocked { background: var(--st-block-track); }
.g-bar.blocked .g-fill { background: var(--st-block); }
.g-bar.blocked.overdue { background: var(--st-block-track); }
.g-bar.blocked.overdue .g-fill { background: var(--st-block); }   /* blocked wins over overdue */
.g-bar.overdue .g-fill { background: var(--st-over); }
.g-bar.blocked::before { content: ''; position: absolute; inset: 0; z-index: 2; background: repeating-linear-gradient(45deg, rgba(31, 36, 48, .35) 0 4px, transparent 4px 8px); }
/* Точки согласования: ромбы */
.g-dia { position: absolute; top: 17px; width: 18px; height: 18px; transform: rotate(45deg); border-radius: 3px; background: var(--st-decision); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--st-decision); cursor: pointer; z-index: 4; transition: opacity .2s, box-shadow .15s; }
.g-dia:hover { box-shadow: 0 0 0 1px var(--st-decision), 0 0 0 5px var(--accent-mid); }
.g-dia.s-Approved { background: var(--st-approved); box-shadow: 0 0 0 1px #12a238; }
.g-dia.s-Rejected, .g-dia.late { background: var(--st-rejected); box-shadow: 0 0 0 1px var(--st-block); }
.g-dia.blocked { background-image: repeating-linear-gradient(45deg, rgba(31, 36, 48, .4) 0 3px, transparent 3px 6px); }
.g-dlabel { position: absolute; top: 17px; line-height: 18px; font-size: var(--fs-xs); font-weight: 600; color: #000; white-space: nowrap; z-index: 4; cursor: pointer; transition: opacity .2s; }
.g-dlabel.g-node { background: none; box-shadow: none; color: #000; }   /* the label must not inherit the status pill fill */
.g-arrows { position: absolute; top: 0; pointer-events: none; z-index: 3; overflow: visible; }
.g-conn .line { transition: opacity .2s, stroke-width .15s; }
.g-conn:hover .line { stroke-width: 2.8; }
.g-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--st-over); z-index: 3; pointer-events: none; opacity: .75; }
.g-tip { position: absolute; z-index: 30; pointer-events: none; background: var(--ink); color: #fff; font-size: var(--fs-xs); line-height: 1.5; padding: var(--s-2) var(--s-3); border-radius: var(--r-md); box-shadow: var(--shadow-lg); max-width: 320px; }
.g-tip b { font-weight: 600; }
/* Цепочка зависимостей: всё, что не входит в неё, приглушается */
.g-canvas.chain-on .g-bar:not(.hl), .g-canvas.chain-on .g-dia:not(.hl), .g-canvas.chain-on .g-dlabel:not(.hl) { opacity: .22; }
.g-canvas.chain-on .g-label:not(.hl) > * { opacity: .35; }
.g-canvas.chain-on .g-conn:not(.hl) .line { opacity: .12; }
.g-canvas.chain-on .g-conn.hl .line { stroke-width: 2.6; }
.g-canvas.chain-on .g-label.hl { background: var(--accent-soft); }
/* Контекстные строки режима «Блокирующие» */
.g-row.ctx .g-bar, .g-row.ctx .g-dia, .g-row.ctx .g-dlabel { opacity: .4; }
.g-row.ctx .g-label > * { opacity: .55; }

/* ---------- Боковая карточка ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 28, 48, .35); z-index: 40; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--surface); z-index: 50; box-shadow: var(--shadow-lg); border-radius: var(--r-lg) 0 0 var(--r-lg); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .28s var(--ease); }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) var(--s-5) var(--s-3); border-bottom: var(--border); }
.drawer-head h3 { font-size: var(--fs-xl); margin-top: 6px; }
.drawer-body { flex: 1; overflow-y: auto; padding: var(--s-4) var(--s-5) var(--s-2); }
.drawer-foot { display: flex; gap: var(--s-2); justify-content: space-between; padding: var(--s-3) var(--s-5); border-top: var(--border); background: #fafbfc; border-radius: 0 0 0 var(--r-lg); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--s-3); }
.form-grid .full { grid-column: 1 / -1; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: var(--s-3); align-items: center; }
.section { margin-top: var(--s-5); padding-top: var(--s-4); border-top: var(--border); }
.section h4 { margin-bottom: var(--s-3); }
.doc-item, .link-item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3); border-radius: 10px; background: var(--bg); margin-bottom: 6px; }
.link-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-item { align-items: flex-start; }
.doc-item .grow { flex: 1; min-width: 0; max-width: 100%; }
.doc-item .link-btn { flex: none; }
.doc-add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: var(--s-2); margin-top: var(--s-2); }
.hist-item { font-size: var(--fs-xs); padding: 6px 0; color: var(--ink); }
.hist-item + .hist-item { border-top: var(--bw) solid var(--line-2); }
.hist-item .when { color: var(--muted); margin-right: 6px; }
/* Выбор участников голосования */
.voters-box { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px var(--s-3); border: var(--bw) solid #dcdfe6; border-radius: 10px; padding: var(--s-3); max-height: 180px; overflow-y: auto; background: #fff; }
.voter-opt { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-sm) !important; color: var(--ink) !important; cursor: pointer; min-width: 0; }

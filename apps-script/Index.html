<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Css'); ?>
</head>
<body>
<div class="wrap">
  <!-- HEADER -->
  <header class="rpt">
    <div>
      <h1 class="rpt-title"><span class="accent">P&amp;L Report</span> Wildberries</h1>
      <p class="rpt-sub" id="subtitle">Отчёт о прибылях и убытках</p>
      <p class="rpt-seller" id="seller">—</p>
      <p class="rpt-period"><span id="periodLine">Загрузка…</span><span id="genLine"></span><span class="data-status" id="dataStatus"></span></p>
    </div>
    <div class="actions">
      <button class="btn-text" id="btnPdf" title="Скачать PDF">PDF</button>
      <span class="btn-sep">·</span>
      <button class="btn-text" id="btnXls" title="Скачать Excel">Excel</button>
      <span class="btn-sep">·</span>
      <button class="btn-text" id="btnPrint" title="Печать">Печать</button>
    </div>
  </header>
  <!-- FILTER (период действует на вкладки P&L ОТЧЕТ, ТОВАРЫ, UNIT) -->
  <section class="filter" id="filter">
    <div class="field">
      <label for="from">Дата от</label>
      <input type="date" id="from">
    </div>
    <div class="field">
      <label for="to">Дата до</label>
      <input type="date" id="to">
    </div>
    <button class="btn primary" id="btnApply">Применить</button>
    <button class="btn ghost" id="btnReset">Сбросить</button>
    <button class="btn ghost" id="btnSync" title="Перечитать данные из Google Таблицы">Обновить данные</button>
    <div class="spacer"></div>
    <div class="hint" id="hint">По умолчанию: <span id="hintDefault">—</span></div>
  </section>
  <!-- TABS: названия = имена листов (подставляются из 00_Config.gs) -->
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="params">ПАРАМЕТРЫ</button>
    <button class="tab" data-tab="pnl">P&amp;L ОТЧЕТ</button>
    <button class="tab" data-tab="goods">ТОВАРЫ</button>
    <button class="tab" data-tab="unit">UNIT</button>
    <button class="tab" data-tab="ref">СПРАВКА</button>
    <div class="spacer"></div>
    <span class="sync"><span id="syncInfo"></span></span>
    <label class="switch" title="Показывать график строки при наведении мыши">
      <input type="checkbox" id="hoverCharts" checked> Графики при наведении
    </label>
  </nav>

  <!-- TAB 1: ПАРАМЕТРЫ -->
  <div class="pane" id="paneParams" hidden>
    <div class="tbl-wrap params-wrap" id="paramsWrap">
      <div class="state" id="paramsState"><div class="spinner"></div>Загружаю данные ...</div>
      <table class="params" id="paramsTable" style="display:none">
        <thead><tr id="paramsThead"></tr></thead>
        <tbody id="paramsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB 2: P&L ОТЧЕТ -->
  <div class="pane" id="panePnl" hidden>
    <div class="tbl-wrap" id="pnlWrap">
      <div class="state" id="pnlState"><div class="spinner"></div>Загружаю данные ...</div>
      <table class="pnl hier" id="pnlTable" style="display:none">
        <thead><tr id="pnlThead"></tr></thead>
        <tbody id="pnlBody"></tbody>
      </table>
    </div>
    <div class="legend">✎ — строка ручного ввода.</div>
  </div>

  <!-- TAB 3: ТОВАРЫ -->
  <div class="pane" id="paneGoods" hidden>
    <div class="goods-bar">
      <input type="search" id="goodsSearch" placeholder="Поиск: артикул WB, артикул, категория">
      <div class="chips" id="abcChips">
        <button class="chip on" data-abc="">Все</button>
        <button class="chip" data-abc="A">A</button>
        <button class="chip" data-abc="B">B</button>
        <button class="chip" data-abc="C">C</button>
      </div>
      <div class="goods-summary" id="goodsSummary"></div>
    </div>
    <div class="tbl-wrap" id="goodsWrap">
      <div class="state" id="goodsState"><div class="spinner"></div>Загружаю данные ...</div>
      <table class="pnl goods" id="goodsTable" style="display:none">
        <thead><tr id="goodsThead"></tr></thead>
        <tbody id="goodsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB 4: UNIT -->
  <div class="pane" id="paneUnit" hidden>
    <div class="unit-bar">
      <label for="unitSku">Артикул WB</label>
      <select id="unitSku" title="Выберите артикул — лист UNIT пересчитается"></select>
      <div class="unit-info" id="unitInfo"></div>
    </div>
    <div class="tbl-wrap" id="unitWrap">
      <div class="state" id="unitState"><div class="spinner"></div>Загружаю данные ...</div>
      <table class="pnl hier unit" id="unitTable" style="display:none">
        <thead><tr id="unitThead"></tr></thead>
        <tbody id="unitBody"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB 5: СПРАВКА -->
  <div class="pane" id="paneRef" hidden>
    <div class="ref-bar">
      <label for="refSelect" id="refLabel">Номер отчёта</label>
      <select id="refSelect" title="Номер отчёта (ячейка B2 листа СПРАВКА)"></select>
      <div class="ref-info" id="refInfo"></div>
    </div>
    <div class="tbl-wrap" id="refWrap">
      <div class="state" id="refState"><div class="spinner"></div>Загружаю данные ...</div>
      <table class="pnl hier ref" id="refTable" style="display:none">
        <thead><tr id="refThead"></tr></thead>
        <tbody id="refBody"></tbody>
      </table>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="rpt">
    <div>© <span id="year"></span> P&amp;L Report Wildberries</div>
    <div>
      <a href="https://winscoms.com/" target="_blank" rel="noopener">
        <b>winscoms</b> <span>— все технологии внутри</span>
      </a>
    </div>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="chart-card" id="chartCard" aria-hidden="true"></div>

<?!= include('Js_chart'); ?>
<?!= include('Js_params'); ?>
<?!= include('Js_pnl'); ?>
<?!= include('Js_goods'); ?>
<?!= include('Js_unit'); ?>
<?!= include('Js_ref'); ?>

</body>
</html>

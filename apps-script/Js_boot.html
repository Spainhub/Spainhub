<script>
/* =====================================================================
 * Js_boot — запуск: названия вкладок (= имена листов), шапка, первая вкладка
 * ===================================================================== */
google.script.run
  .withSuccessHandler(init => {
    state.init = init;
    init.tabs.forEach(t => {
      const b = document.querySelector(`#tabs .tab[data-tab="${t.id}"]`);
      if (!b) return;
      b.textContent = t.title;
      b.classList.toggle('missing', !t.exists);
      if (!t.exists) b.title = 'Лист не найден — меню «Отчёты МП» → «Листы» → «Создать недостающие листы»';
    });
    if (init.chart) state.chart = init.chart;
    applyHeader(init.header);
    setStatus(init.status);
    pnlReloadSeries();
    setTab(TAB_IDS[0]);
  })
  .withFailureHandler(err => {
    toast(err.message || String(err), true);
    setTab(TAB_IDS[0]);
  })
  .App_getInit();
</script>

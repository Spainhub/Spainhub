name: Deploy to VPS

on:
  push:
    branches: [ "winscoms/main" ]   # Ветка, изменения в которой запускают деплой
  workflow_dispatch:                 # Возможность запустить вручную

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/projects/winscoms_pnl
            git fetch origin winscoms/main
            git reset --hard origin/winscoms/main
            # Если нужно перезапустить сервис, добавьте команду ниже (пример)
            # systemctl restart your-service-name

name: Deploy to VPS

on:
  push:
    branches: [ "winscoms/main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # ← было appleboy/ssh-action, исправлено

      - name: Debug secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST is EMPTY!"
          else
            echo "VPS_HOST is set (length: ${#VPS_HOST})"
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "VPS_USER is EMPTY!"
          else
            echo "VPS_USER is set (length: ${#VPS_USER})"
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "VPS_SSH_KEY is EMPTY!"
          else
            echo "VPS_SSH_KEY is set (length: ${#VPS_SSH_KEY})"
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0   # ← обновлено с v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/projects/winscoms_pnl
            git pull origin main

name: Deploy to VPS

on:
  push:
    branches: [ "main" ] # Укажите вашу основную ветку, если она называется иначе
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3 # Популярный и надежный экшен для SSH
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Перейдите в директорию вашего проекта на сервере
            cd /root/projects/winscoms_pnl
            
            # Обновите код (предполагается, что на сервере настроен git remote)
            git pull origin main
            
            # Здесь можно добавить команды для перезапуска сервиса, установки зависимостей и т.д.
            # Например: npm install, systemctl restart myapp, docker-compose up -d

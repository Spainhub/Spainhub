<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);

  // Диагностика: если скрипт выполнился — placeholder сразу меняется.
  // Если на экране всё ещё «Подготовка приложения…», значит этот файл (Scripts) не загрузился.
  (function () {
    const p = document.getElementById('panes');
    if (p) p.innerHTML = '<div class="state"><span class="spinner"></span>Запуск…</div>';
    window.addEventListener('error', function (e) {
      const box = document.getElementById('panes');
      if (box && /Запуск|Подключение/.test(box.textContent)) {
        box.innerHTML = '<div class="state">Ошибка скрипта: ' + String(e.message).replace(/</g, '&lt;') + '</div>';
      }
    });
  })();
  const state = { sheets: [], activeSheet: null, cache: {} };
  const tableState = {};
  const requestCounter = {};
  let appBooted = false;
  let activePop = null;
  let outsideCloseHandler = null;
  let chartInstance = null;
  let prefetchToken = 0;

  // ───────── утилиты ─────────
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(message) {
    const node = $('toast');
    node.textContent = message;
    node.classList.add('on');
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove('on'), 2400);
  }
  function errorText(err) { return err && err.message ? err.message : String(err || 'Неизвестная ошибка'); }
  function isBlank(v) { return v === '' || v === null || v === undefined; }

  /**
   * Форматирование по коду формата от сервера:
   *   -1 — как есть, 0..9 — число с N знаками, 100+N — процент с N знаками (значение — доля).
   */
  function fmtCell(value, code) {
    if (isBlank(value)) return '';
    if (code === -1 || typeof value !== 'number') return String(value);
    if (code >= 100) {
      const d = code - 100;
      return (value * 100).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
    }
    return value.toLocaleString('ru-RU', { minimumFractionDigits: code, maximumFractionDigits: code });
  }

  function numOf(value) {
    return typeof value === 'number' ? value : NaN;
  }

  // ───────── API ─────────
  function apiListSheets() {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('Google Apps Script недоступен. Откройте опубликованное Web App.'));
        return;
      }
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(errorText(err))))
        .getSheetsList();
    });
  }
  function apiBootstrap() {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('Google Apps Script недоступен. Откройте опубликованное Web App.'));
        return;
      }
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(errorText(err))))
        .getBootstrap();
    });
  }
  function apiGetSheet(name) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(errorText(err))))
        .getSheetData(name);
    });
  }

  // ───────── запуск ─────────
  function boot() {
    if (appBooted) return;
    appBooted = true;
    $('year').textContent = new Date().getFullYear();
    $('btnReload').addEventListener('click', () => {
      if (!state.activeSheet) return;
      state.cache = {};
      Object.keys(tableState).forEach(key => delete tableState[key]);
      loadActive(true);
    });
    $('btnPrint').addEventListener('click', () => window.print());
    let searchTimer = null;
    $('globalSearch').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const entry = state.cache[state.activeSheet];
        if (entry) renderPane(state.activeSheet, entry.data);
      }, 120);
    });
    $('chartClose').addEventListener('click', closeChart);
    $('chartModal').addEventListener('click', e => { if (e.target === $('chartModal')) closeChart(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeChart(); closeFilterPop(); }
    });

    $('panes').innerHTML = '<div class="state"><span class="spinner"></span>Подключение к Google Sheets…</div>';
    apiBootstrap().then(boot => {
      const sheets = boot && boot.sheets;
      if (!Array.isArray(sheets)) throw new Error('Некорректный ответ сервера.');
      state.sheets = sheets;
      $('panes').innerHTML = '';
      buildTabs();
      sheets.forEach(s => getOrCreatePane(s.name));
      if (!sheets.length) { $('panes').innerHTML = '<div class="state">Не найдено доступных листов. Проверьте названия вкладок.</div>'; return; }
      if (boot.first && boot.first.name === sheets[0].name) {
        prepareData(boot.first);
        state.cache[boot.first.name] = { loadedAt: Date.now(), data: boot.first };
        $('dataStatus').textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      }
      activateSheet(sheets[0].name);
      prefetchOthers();
    }).catch(err => {
      $('panes').innerHTML = '<div class="state">Ошибка подключения: ' + escapeHtml(errorText(err)) + '</div>';
    });
  }

  function buildTabs() {
    const nav = $('tabs');
    nav.querySelectorAll('.tab').forEach(n => n.remove());
    const spacer = nav.querySelector('.spacer');
    state.sheets.forEach(sheet => {
      const b = el('button', 'tab', sheet.title);
      b.type = 'button';
      b.dataset.sheet = sheet.name;
      if (sheet.marketplace) b.classList.add('mp');
      b.addEventListener('click', () => activateSheet(sheet.name));
      nav.insertBefore(b, spacer);
    });
  }

  function paneId(name) { return 'pane-' + name.replace(/[^a-z0-9]/gi, '_'); }

  function activateSheet(name) {
    state.activeSheet = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.sheet === name));
    document.querySelectorAll('.pane').forEach(p => p.hidden = p.dataset.sheet !== name);
    closeChart();
    closeFilterPop();
    loadActive(false);
  }

  function getOrCreatePane(name) {
    const id = paneId(name);
    let pane = document.getElementById(id);
    if (pane && pane._ref) return pane._ref;

    pane = el('section', 'pane');
    pane.id = id;
    pane.dataset.sheet = name;
    pane.hidden = true;

    const info = el('div', 'info');
    const viewBar = el('div', 'view-bar-host');
    const tableWrap = el('div', 'tbl-wrap');
    const stateBox = el('div', 'state');
    tableWrap.appendChild(stateBox);
    pane.append(info, viewBar, tableWrap);
    $('panes').appendChild(pane);

    const ref = { pane, info, viewBar, tableWrap, state: stateBox };
    pane._ref = ref;
    return ref;
  }

  function loadActive(force) {
    const name = state.activeSheet;
    if (!name) return;
    const ref = getOrCreatePane(name);
    if (!force && state.cache[name]) { renderPane(name, state.cache[name].data); return; }

    requestCounter[name] = (requestCounter[name] || 0) + 1;
    const requestId = requestCounter[name];
    ref.state.style.display = '';
    ref.state.innerHTML = '<span class="spinner"></span>Загружаю данные…';
    ref.tableWrap.style.display = 'none';
    ref.viewBar.innerHTML = '';
    $('rowCount').textContent = '';
    $('btnReload').disabled = true;
    $('dataStatus').textContent = 'Загрузка…';

    apiGetSheet(name).then(data => {
      if (requestCounter[name] !== requestId) return;
      if (!data || data.name !== name) throw new Error('Сервер вернул некорректные данные.');
      prepareData(data);
      state.cache[name] = { loadedAt: Date.now(), data };
      renderPane(name, data);
      $('dataStatus').textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      if (force) toast('Данные обновлены');
      prefetchOthers();
    }).catch(err => {
      if (requestCounter[name] !== requestId) return;
      ref.state.style.display = '';
      ref.tableWrap.style.display = 'none';
      ref.state.textContent = 'Ошибка загрузки: ' + errorText(err);
      $('dataStatus').textContent = 'Ошибка загрузки';
      if (force) toast('Не удалось обновить данные');
    }).finally(() => {
      if (requestCounter[name] === requestId) $('btnReload').disabled = false;
    });
  }

  /** Фоновая подгрузка остальных листов — переключение вкладок становится мгновенным. */
  /** Остальные листы грузятся параллельно в фоне — переключение вкладок мгновенное. */
  function prefetchOthers() {
    const token = ++prefetchToken;
    state.sheets.map(s => s.name).filter(n => !state.cache[n]).forEach(name => {
      apiGetSheet(name).then(data => {
        if (token !== prefetchToken || state.cache[name] || !data || data.name !== name) return;
        prepareData(data);
        state.cache[name] = { loadedAt: Date.now(), data };
      }).catch(() => {});
    });
  }

  function toRows(values, fmts) {
    return (values || []).map((v, i) => {
      const f = (fmts && fmts[i]) || [];
      return { v, f, t: v.map((x, c) => fmtCell(x, f[c])) };
    });
  }
  function toTotal(total) {
    if (!total) return null;
    return { v: total.v, f: total.f, t: total.v.map((x, c) => fmtCell(x, total.f[c])) };
  }
  function prepareData(data) {
    if (data.tables) {
      data.tables.forEach(t => { t.rowObjs = toRows(t.rows, t.fmts); t.totalObj = toTotal(t.totalRow); });
    } else {
      data.rowObjs = toRows(data.rows, data.fmts);
      data.totalObj = toTotal(data.totalRow);
    }
  }

  // ───────── информационный блок (строки 1–5) ─────────
  function renderInfo(box, info) {
    box.innerHTML = '';
    if (!info || !info.rows || !info.rows.length) return;
    const rows = info.rows, W = info.width;
    const covered = rows.map(() => new Array(W).fill(false));
    const origin = {};
    (info.merges || []).forEach(m => {
      origin[m.r + ':' + m.c] = m;
      for (let r = m.r; r < m.r + m.rs && r < rows.length; r++)
        for (let c = m.c; c < m.c + m.cs && c < W; c++) covered[r][c] = true;
    });

    const table = el('table', 'info-grid');
    rows.forEach((row, r) => {
      const tr = el('tr', 'r' + (r + 1));
      const rowEmpty = row.every(isBlank) && !(info.merges || []).some(m => r >= m.r && r < m.r + m.rs);
      if (rowEmpty) tr.classList.add('blank');
      for (let c = 0; c < W; c++) {
        const m = origin[r + ':' + c];
        if (covered[r][c] && !m) continue;
        const td = el('td');
        const text = fmtCell(row[c], info.fmts[r][c]);
        td.textContent = text;
        if (typeof row[c] === 'number' && row[c] < 0) td.classList.add('neg');
        if (m) {
          td.colSpan = m.cs; td.rowSpan = m.rs; td.classList.add('merged');
          c += m.cs - 1;
        } else {
          // как в Sheets: текст «переливается» вправо через пустые соседние ячейки
          let span = 1;
          if (text !== '') {
            while (c + span < W && isBlank(row[c + span]) && !covered[r][c + span]) span++;
          } else {
            while (c + span < W && isBlank(row[c + span]) && !covered[r][c + span] && !origin[r + ':' + (c + span)]) span++;
          }
          if (span > 1) td.colSpan = span;
          c += span - 1;
        }
        tr.appendChild(td);
      }
      table.appendChild(tr);
    });
    box.appendChild(table);
  }

  // ───────── отрисовка вкладки ─────────
  function renderPane(name, data) {
    const pane = document.getElementById(paneId(name));
    if (!pane || !pane._ref) return;
    const ref = pane._ref;
    renderInfo(ref.info, data.info);
    if (data.meta && data.meta.twoTables) renderTwoTables(ref, data);
    else renderSingleTable(ref, data);
  }

  function getTableState(key, data, columns, rows, total, meta, sheetName, sortable) {
    let ts = tableState[key];
    if (!ts || ts._data !== data) {
      ts = tableState[key] = {
        key, _data: data, columns: columns || [], rows: rows || [], total: total || null,
        meta: meta || {}, sheetName, sortable,
        sortIdx: -1, sortDir: 1, filters: {}, global: '', abcFilter: new Set(), unit: null
      };
    }
    return ts;
  }

  function filteredRows(ts) {
    let rows = ts.rows;
    const keys = Object.keys(ts.filters);
    if (keys.length) {
      rows = rows.filter(row => keys.every(k => {
        const set = ts.filters[k];
        return !set || !set.size || set.has(row.t[Number(k)]);
      }));
    }
    if (ts.abcFilter.size && ts.meta.abcIdx >= 0) {
      rows = rows.filter(row => ts.abcFilter.has(abcClass(row.v[ts.meta.abcIdx])));
    }
    if (ts.unit) {
      rows = rows.filter(row => row.t.slice(0, 3).some(x => normUnit(x).indexOf(ts.unit) !== -1));
    }
    const q = ts.global.trim().toLowerCase();
    if (q) rows = rows.filter(row => row.t.some(x => x.toLowerCase().includes(q)));
    if (ts.sortIdx >= 0) {
      const i = ts.sortIdx, dir = ts.sortDir;
      rows = rows.slice().sort((a, b) => {
        const na = numOf(a.v[i]), nb = numOf(b.v[i]);
        if (!isNaN(na) && !isNaN(nb)) return (na - nb) * dir;
        if (!isNaN(na)) return -1;
        if (!isNaN(nb)) return 1;
        return a.t[i].localeCompare(b.t[i], 'ru') * dir;
      });
    }
    return rows;
  }

  function renderSingleTable(ref, data) {
    const dateSeries = (data.dateSeries || []).map(d => ({
      pos: data.columns.findIndex(c => c.idx === d.idx), label: d.label
    })).filter(d => d.pos >= 0);

    const ts = getTableState(data.name + '|single', data, data.columns, data.rowObjs, data.totalObj,
      Object.assign({}, data.meta || {}, { dateSeries }), data.name, data.sortable);
    ts.global = $('globalSearch').value || '';
    const rows = filteredRows(ts);

    ref.state.style.display = 'none';
    ref.viewBar.innerHTML = '';
    ref.viewBar.appendChild(buildViewBar(ts));
    ref.tableWrap.style.display = '';
    ref.tableWrap.className = 'tbl-wrap';
    ref.tableWrap.innerHTML = '';
    ref.tableWrap.appendChild(buildTable(ts, rows, data));
    syncHeadHeight(ref.tableWrap);
    $('rowCount').textContent = 'Строк: ' + rows.length + ' / ' + ts.rows.length;
  }

  /** Несколько таблиц на листе — одна под другой. */
  function renderTwoTables(ref, data) {
    ref.state.style.display = 'none';
    ref.viewBar.innerHTML = '';
    ref.tableWrap.style.display = '';
    ref.tableWrap.className = 'pl';
    ref.tableWrap.innerHTML = '';
    const row = el('div', 'tables-row');
    (data.tables || []).forEach(tbl => {
      const ts = getTableState(data.name + '|' + tbl.key, data, tbl.columns, tbl.rowObjs, tbl.totalObj,
        { abcIdx: tbl.abcIdx, units: tbl.units || [] }, data.name, data.sortable);
      ts.global = $('globalSearch').value || '';
      const visible = filteredRows(ts);
      const block = el('div', 'table-block');
      const head = el('div', 'table-head');
      head.appendChild(el('div', 'sub-table-title', tbl.title));
      head.appendChild(buildViewBar(ts));
      block.appendChild(head);
      const wrap = el('div', 'tbl-wrap');
      wrap.appendChild(buildTable(ts, visible, data));
      block.appendChild(wrap);
      row.appendChild(block);
    });
    ref.tableWrap.appendChild(row);
    ref.tableWrap.querySelectorAll('.tbl-wrap').forEach(syncHeadHeight);
    $('rowCount').textContent = '';
  }

  // ───────── скрытие/показ столбцов, фильтр ABC, быстрые фильтры по юнитам ─────────
  const hiddenStore = {};
  const LS_PREFIX = 'wc.hidden.';

  function lsGet(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* хранилище недоступно */ }
  }
  function hiddenSet(ts) {
    if (!hiddenStore[ts.key]) hiddenStore[ts.key] = new Set(lsGet(LS_PREFIX + ts.key) || []);
    return hiddenStore[ts.key];
  }
  function normUnit(text) {
    return String(text || '').toLowerCase().replace(/[^a-zа-я0-9]/g, '').replace(/ozon/g, 'oz');
  }

  /** Столбцы, которые можно скрывать (столбцы-даты WB уходят в график и в список не попадают). */
  function togglableColumns(ts) {
    const dates = new Set(ts.meta && ts.meta.dateColumns ? (ts.meta.dateSeries || []).map(d => d.pos) : []);
    return ts.columns.map((col, pos) => ({ col, pos })).filter(x => !dates.has(x.pos));
  }

  function buildViewBar(ts) {
    const bar = el('div', 'view-bar');
    const left = el('div', 'view-left');

    // быстрые фильтры по юнитам (Ozon Kvantum, Ozon Azimut, WB Kvantum, WB Azimut)
    const units = (ts.meta && ts.meta.units) || [];
    units.forEach(name => {
      const key = normUnit(name);
      const chip = el('button', 'chip unit' + (ts.unit === key ? ' on' : ''), name);
      chip.type = 'button';
      chip.title = 'Показать только: ' + name;
      chip.addEventListener('click', () => { ts.unit = ts.unit === key ? null : key; redraw(ts); });
      left.appendChild(chip);
    });

    // отдельный фильтр ABC
    if (ts.meta && ts.meta.abcIdx >= 0) {
      left.appendChild(el('span', 'bar-label', 'ABC'));
      ['A', 'B', 'C'].forEach(k => {
        const chip = el('button', 'chip abc-chip abc-' + k + (ts.abcFilter.has(k) ? ' on' : ''), k);
        chip.type = 'button';
        chip.title = 'Фильтр ABC: ' + k;
        chip.addEventListener('click', () => {
          if (ts.abcFilter.has(k)) ts.abcFilter.delete(k); else ts.abcFilter.add(k);
          redraw(ts);
        });
        left.appendChild(chip);
      });
    }
    bar.appendChild(left);

    const hidden = hiddenSet(ts);
    const total = togglableColumns(ts).length;
    const shown = togglableColumns(ts).filter(x => !hidden.has(x.col.label)).length;
    const btn = el('button', 'cols-btn' + (shown < total ? ' on' : ''), 'Столбцы ' + shown + '/' + total + ' ▾');
    btn.type = 'button';
    btn.addEventListener('click', e => { e.stopPropagation(); openColumnsPicker(ts, btn, () => redraw(ts)); });
    bar.appendChild(btn);
    return bar;
  }

  function openColumnsPicker(ts, anchor, onApply) {
    closeFilterPop();
    const hidden = hiddenSet(ts);
    const items = togglableColumns(ts);
    const pop = el('div', 'filter-pop');
    pop.appendChild(el('div', 'pop-title', 'Показать столбцы'));
    const list = el('div', 'vals');
    const checks = items.map(({ col }) => {
      const label = el('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !hidden.has(col.label);
      label.append(cb, document.createTextNode(col.label || '(без названия)'));
      list.appendChild(label);
      return cb;
    });
    pop.appendChild(list);
    const actions = el('div', 'pop-actions');
    const all = el('button', '', 'Все'), none = el('button', '', 'Снять'), apply = el('button', 'primary', 'Применить');
    [all, none, apply].forEach(b => b.type = 'button');
    actions.append(all, none, apply);
    pop.appendChild(actions);
    all.addEventListener('click', () => checks.forEach(c => c.checked = true));
    none.addEventListener('click', () => checks.forEach(c => c.checked = false));
    apply.addEventListener('click', () => {
      if (!checks.some(c => c.checked)) { toast('Оставьте хотя бы один столбец'); return; }
      hidden.clear();
      items.forEach(({ col }, i) => { if (!checks[i].checked) hidden.add(col.label); });
      lsSet(LS_PREFIX + ts.key, Array.from(hidden));
      closeFilterPop();
      onApply();
    });
    document.body.appendChild(pop);
    const rect = anchor.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(rect.right - 250, window.innerWidth - 260)) + 'px';
    pop.style.top = Math.max(8, Math.min(rect.bottom + 5, window.innerHeight - 340)) + 'px';
    activePop = pop;
    outsideCloseHandler = e => {
      if (activePop && !activePop.contains(e.target) && e.target !== anchor) closeFilterPop();
    };
    setTimeout(() => document.addEventListener('mousedown', outsideCloseHandler), 0);
  }

  /** Высота шапки → отступ закреплённой итоговой строки. */
  function syncHeadHeight(wrap) {
    const thead = wrap.querySelector('thead');
    if (thead) wrap.style.setProperty('--head-h', thead.offsetHeight + 'px');
  }

  const widthStore = {}; // ширины столбцов переживают «Обновить»

  function abcClass(value) {
    const map = { 'А': 'A', 'В': 'B', 'С': 'C' };
    const s = String(value || '').trim().toUpperCase();
    const k = map[s] || s;
    return (k === 'A' || k === 'B' || k === 'C') ? k : '';
  }

  /** Начальная ширина столбца по самому длинному значению (в разумных пределах). */
  function autoWidth(ts, pos) {
    let chars = String(ts.columns[pos].label || '').length + (ts.sortable ? 5 : 2);
    const lim = Math.min(ts.rows.length, 200);
    for (let i = 0; i < lim; i++) { const l = ts.rows[i].t[pos].length; if (l > chars) chars = l; }
    if (ts.total) chars = Math.max(chars, ts.total.t[pos].length);
    return Math.max(56, Math.min(340, Math.round(chars * 7 + 24)));
  }

  function fillCell(td, ts, pos, value, text) {
    td.title = text;
    if (typeof value === 'number' && value < 0) td.classList.add('neg');
    if (ts.meta.abcIdx >= 0 && pos === ts.meta.abcIdx) {
      const k = abcClass(value);
      if (k) { td.appendChild(el('span', 'abc-pill abc-' + k, text.trim() || k)); return; }
    }
    td.textContent = text;
  }

  function attachGrip(th, colEl, widths, pos, resetWidth, applyMin) {
    const grip = el('span', 'col-grip');
    grip.title = 'Потяните, чтобы изменить ширину (двойной клик — по содержимому)';
    grip.addEventListener('click', e => e.stopPropagation());
    grip.addEventListener('dblclick', e => {
      e.stopPropagation();
      widths[pos] = resetWidth();
      colEl.style.width = widths[pos] + 'px';
      applyMin();
    });
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX, startW = widths[pos];
      grip.setPointerCapture(e.pointerId);
      document.body.classList.add('resizing');
      const move = ev => {
        widths[pos] = Math.max(40, Math.min(900, Math.round(startW + ev.clientX - startX)));
        colEl.style.width = widths[pos] + 'px';
        applyMin();
      };
      const up = () => {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        document.body.classList.remove('resizing');
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });
    th.appendChild(grip);
  }

  function buildTable(ts, rows, data) {
    const table = el('table', 'report');
    const colgroup = el('colgroup');
    const thead = el('thead');
    const headRow = el('tr');

    const dateSeries = (ts.meta && ts.meta.dateSeries) || [];
    const dateSet = new Set(ts.meta && ts.meta.dateColumns ? dateSeries.map(d => d.pos) : []);
    const hasChart = dateSeries.length > 0;
    const hiddenCols = hiddenSet(ts);
    const visible = ts.columns.map((col, pos) => ({ col, pos })).filter(x => !dateSet.has(x.pos) && !hiddenCols.has(x.col.label));

    const widths = widthStore[ts.key] || (widthStore[ts.key] = {});
    visible.forEach(({ pos }) => { if (widths[pos] == null) widths[pos] = autoWidth(ts, pos); });
    widths.chart = 200;
    const keys = visible.map(x => x.pos).concat(hasChart ? ['chart'] : []);
    const applyMin = () => { table.style.minWidth = keys.reduce((sum, k) => sum + widths[k], 0) + 'px'; };

    visible.forEach(({ col, pos }) => {
      const colEl = el('col');
      colEl.style.width = widths[pos] + 'px';
      colgroup.appendChild(colEl);

      const th = el('th');
      th.title = col.label;
      const inner = el('div', 'th-in');
      inner.appendChild(el('span', 'th-label', col.label));
      if (ts.sortable) {
        th.classList.add('sortable');
        if (ts.sortIdx === pos) inner.appendChild(el('span', 'sort-ind', ts.sortDir > 0 ? '▲' : '▼'));
        const filter = el('button', 'col-filter-btn', '▼');
        filter.type = 'button';
        filter.title = 'Фильтр столбца';
        if (ts.filters[pos] && ts.filters[pos].size) filter.classList.add('on');
        filter.addEventListener('click', e => {
          e.stopPropagation();
          openFilter(ts, pos, filter, () => redraw(ts));
        });
        inner.appendChild(filter);
        th.addEventListener('click', e => {
          if (e.target.classList.contains('col-filter-btn')) return;
          if (ts.sortIdx === pos) {
            if (ts.sortDir === 1) ts.sortDir = -1; else { ts.sortIdx = -1; ts.sortDir = 1; }
          } else { ts.sortIdx = pos; ts.sortDir = 1; }
          redraw(ts);
        });
      }
      th.appendChild(inner);
      attachGrip(th, colEl, widths, pos, () => autoWidth(ts, pos), applyMin);
      headRow.appendChild(th);
    });
    if (hasChart) {
      const colEl = el('col');
      colEl.style.width = widths.chart + 'px';
      colgroup.appendChild(colEl);
      headRow.appendChild(el('th', 'chart-action-cell', 'График'));
    }
    // «добивающий» столбец: забирает свободное место, чтобы ширины остальных были точными
    colgroup.appendChild(el('col'));
    headRow.appendChild(el('th', 'filler'));
    applyMin();
    table.appendChild(colgroup);
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = el('tbody');
    if (ts.total) {
      const tr = el('tr', 'total-row');
      visible.forEach(({ pos }) => {
        const td = el('td');
        fillCell(td, ts, pos, ts.total.v[pos], ts.total.t[pos]);
        tr.appendChild(td);
      });
      if (hasChart) tr.appendChild(el('td', 'chart-action-cell', ''));
      tr.appendChild(el('td', 'filler'));
      tbody.appendChild(tr);
    }

    const frag = document.createDocumentFragment();
    rows.forEach(row => {
      const tr = el('tr');
      visible.forEach(({ pos }) => {
        const td = el('td');
        fillCell(td, ts, pos, row.v[pos], row.t[pos]);
        tr.appendChild(td);
      });
      if (hasChart) {
        const td = el('td', 'chart-action-cell');
        const points = seriesPoints(dateSeries, row);
        const wrap = el('div', 'chart-cell');
        if (points.length >= 2) {
          const open = () => openRowChart(rowTitle(row, ts), points);
          const spark = sparkline(points);
          spark.addEventListener('click', open);
          spark.style.cursor = 'pointer';
          wrap.appendChild(spark);
          const btn = el('button', 'row-chart-btn', 'Открыть');
          btn.type = 'button';
          btn.addEventListener('click', open);
          wrap.appendChild(btn);
        } else {
          wrap.appendChild(el('span', 'spark-empty', '—'));
        }
        td.appendChild(wrap);
        tr.appendChild(td);
      }
      tr.appendChild(el('td', 'filler'));
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    table.appendChild(tbody);
    return table;
  }

  function rowTitle(row, ts) {
    // самый информативный текст строки: название/SKU, иначе первый непустой
    const preferred = ts.columns.findIndex(c => /назв|name|товар|product/i.test(c.label));
    const idx = preferred >= 0 && !isBlank(row.v[preferred]) ? preferred : row.v.findIndex((v, i) => i > 0 && !isBlank(v));
    return idx >= 0 ? row.t[idx] : 'Показатель';
  }

  function redraw(ts) {
    const entry = state.cache[ts.sheetName];
    if (entry) renderPane(ts.sheetName, entry.data);
  }

  // ───────── фильтр столбца ─────────
  function openFilter(ts, col, anchor, onApply) {
    closeFilterPop();
    const counts = {};
    ts.rows.forEach(r => { const k = r.t[col]; counts[k] = (counts[k] || 0) + 1; });
    const keys = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));
    const pop = el('div', 'filter-pop');
    const search = el('input');
    search.type = 'search';
    search.placeholder = 'Найти значение…';
    pop.appendChild(search);
    const list = el('div', 'vals');
    const checks = {};
    keys.forEach(key => {
      const label = el('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = ts.filters[col] ? ts.filters[col].has(key) : true;
      checks[key] = cb;
      label.append(cb, document.createTextNode((key || '(пусто)') + ' · ' + counts[key]));
      list.appendChild(label);
    });
    pop.appendChild(list);
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      keys.forEach(k => checks[k].parentNode.style.display = k.toLowerCase().includes(q) ? '' : 'none');
    });
    const actions = el('div', 'pop-actions');
    const all = el('button', '', 'Все'), none = el('button', '', 'Снять'), apply = el('button', 'primary', 'Применить');
    [all, none, apply].forEach(b => b.type = 'button');
    actions.append(all, none, apply);
    pop.appendChild(actions);
    all.addEventListener('click', () => keys.forEach(k => checks[k].checked = true));
    none.addEventListener('click', () => keys.forEach(k => checks[k].checked = false));
    apply.addEventListener('click', () => {
      const selected = keys.filter(k => checks[k].checked);
      if (selected.length === keys.length) delete ts.filters[col];
      else ts.filters[col] = new Set(selected);
      closeFilterPop();
      onApply();
    });
    document.body.appendChild(pop);
    const rect = anchor.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 260)) + 'px';
    pop.style.top = Math.max(8, Math.min(rect.bottom + 5, window.innerHeight - 320)) + 'px';
    activePop = pop;
    outsideCloseHandler = e => {
      if (activePop && !activePop.contains(e.target) && e.target !== anchor) closeFilterPop();
    };
    setTimeout(() => document.addEventListener('mousedown', outsideCloseHandler), 0);
  }

  function closeFilterPop() {
    if (outsideCloseHandler) document.removeEventListener('mousedown', outsideCloseHandler);
    outsideCloseHandler = null;
    if (activePop && activePop.parentNode) activePop.parentNode.removeChild(activePop);
    activePop = null;
  }

  // ───────── графики ─────────
  function parseDate(value) {
    const m = String(value).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : 0;
  }

  function seriesPoints(dateSeries, row) {
    return dateSeries
      .map(d => ({ label: d.label, value: numOf(row.v[d.pos]), pct: (row.f[d.pos] || 0) >= 100 }))
      .filter(p => !isNaN(p.value))
      .sort((a, b) => parseDate(a.label) - parseDate(b.label));
  }

  function sparkline(points) {
    const NS = 'http://www.w3.org/2000/svg';
    const w = 84, h = 24, pad = 2;
    const vals = points.map(p => p.value);
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const span = max - min || 1;
    const pts = vals.map((v, i) => {
      const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
      const y = h - pad - ((v - min) / span) * (h - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'spark');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    const line = document.createElementNS(NS, 'polyline');
    line.setAttribute('points', pts);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', '#ef7b22');
    line.setAttribute('stroke-width', '1.6');
    line.setAttribute('stroke-linejoin', 'round');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
    return svg;
  }

  function openRowChart(title, points) {
    if (typeof Chart === 'undefined') { toast('Не удалось загрузить библиотеку графиков'); return; }
    if (points.length < 2) { toast('Для построения графика недостаточно числовых данных'); return; }

    $('chartTitle').textContent = title;
    $('chartModal').classList.add('on');
    $('chartModal').setAttribute('aria-hidden', 'false');
    if (chartInstance) chartInstance.destroy();

    const isPercent = points.some(p => p.pct);
    const values = points.map(p => isPercent ? Math.round(p.value * 10000) / 100 : Math.round(p.value));
    const suffix = isPercent ? '%' : '';
    chartInstance = new Chart($('trendCanvas').getContext('2d'), {
      type: 'line',
      data: {
        labels: points.map(p => p.label),
        datasets: [{
          label: title, data: values, borderColor: '#ef7b22', backgroundColor: 'rgba(239,123,34,.13)',
          fill: true, tension: .28, pointRadius: 2, pointHoverRadius: 5, borderWidth: 2, spanGaps: true
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => c.parsed.y.toLocaleString('ru-RU') + suffix } }
        },
        scales: {
          x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 12, font: { size: 10 } } },
          y: { ticks: { font: { size: 10 }, callback: v => Number(v).toLocaleString('ru-RU') + suffix } }
        }
      }
    });
  }

  function closeChart() {
    $('chartModal').classList.remove('on');
    $('chartModal').setAttribute('aria-hidden', 'true');
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
})();
</script>
